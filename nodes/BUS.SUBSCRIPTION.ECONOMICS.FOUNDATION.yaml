id: "BUS.SUBSCRIPTION.ECONOMICS.FOUNDATION"
name_en: "Subscription Economics Foundation"
name_zh: "订阅经济基础"
domain: "BUSINESS"
module: "Subscription Economics（订阅经济）"
importance: "Core"
mastery_current: "L0"
mastery_candidate: "L1"

what: "A subscription business exchanges recurring payment for continuing access or service. Its customer stock changes through additions and exits, while period revenue is generated by active customer-periods, realized prices, and plan mix."
why: "Ending subscriber count, gross additions, cancellations, and revenue measure different parts of the relationship. Treating any one as the whole business can hide deteriorating retention, acquisition dependence, price effects, or timing lags."
mechanism: "Follow one paying household through a customer-month, distinguish beginning stock, starts or rejoins, cancellations, ending stock, price, plan, and cohort, then connect period revenue to the customer-months actually active during that period."
example: "Netflix began Q3 2011 with 24.594 million unique U.S. subscribers, added 4.714 million and recorded 5.519 million cancellations, ending at 23.789 million. U.S. revenue still grew 44% year over year to $799 million because revenue reflected customer-months, price and mix, while cancellations were back-loaded."
my_take: "I should analyze a subscription as a stock changed by relationship flows, not as a signup count or one month's revenue snapshot."

