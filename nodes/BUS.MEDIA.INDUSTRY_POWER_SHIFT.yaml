id: "BUS.MEDIA.INDUSTRY_POWER_SHIFT"
name_en: "Media Industry Power Shift"
name_zh: "媒体行业权力转移"
domain: "BUSINESS"
module: "Subscription Video / Pay-TV / Streaming（订阅视频 / 付费电视 / 流媒体）"
importance: "Core"
mastery_current: "L0"
mastery_candidate: "L1"

what: "Media bargaining power depends on each party's outside option, no-deal cost, time sensitivity, and control of scarce content, customer access, broadband, billing, packaging, data, and discovery. DTC and broadband alter but do not eliminate bilateral dependence."
why: "Treating DTC as complete disintermediation or broadband ownership as independence hides why programmers and distributors continue to negotiate hybrid linear, streaming, and wholesale arrangements."
mechanism: "Compare what each party loses during a blackout, how quickly households switch, which assets are difficult to replace, and which price or non-price terms can improve each side's fallback path."
example: "The 2023 Charter-Disney dispute restored 19 Disney networks, removed eight, added wholesale Disney+ and ESPN+ entitlements, and expanded package flexibility; a 2025 agreement later added Hulu and returned the eight networks under changed terms."
my_take: "I should judge media power from the cost of no agreement and the substitutability of each specific asset, not from company size or the existence of an app alone."

