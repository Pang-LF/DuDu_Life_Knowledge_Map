id: "SYSTEM.SEMICONDUCTOR.ADVANCED_PACKAGING_CHIPLETS_COMPOUND_YIELD"
name_en: "Advanced Packaging, Chiplets and Compound Yield"
name_zh: "先进封装、芯粒与组合良率"
domain: "SYSTEM"
module: "Compute Systems（计算系统）"
importance: "Core"
mastery_current: "L0"
mastery_candidate: "L1"

what: "Advanced packaging makes multiple known-good die, interconnect structures, power and thermal paths behave as one product; chiplets change yield economics by allowing good small die to be harvested and recombined, while compound yield requires every necessary component and assembly interface to succeed."
why: "Modern CPUs, GPUs and AI accelerators increasingly exceed the economic or physical convenience of one monolithic die, so final compute supply depends on good-die availability, package integration, HBM, substrates, bonding, test and cooling rather than wafer fabrication alone."
mechanism: "Partition functions into chiplets; fabricate them on suitable processes; test and bin die before assembly; match known-good components; place and connect them through substrate, interposer, RDL, micro-bumps or hybrid bonds; provide power and thermal paths; then run package and system test so component yield, assembly yield and interface yield become final good-package output."
example: "AMD's EPYC Rome architecture combined up to eight 7nm core-complex die with one mature-process I/O die through Infinity Fabric, reaching up to 64 cores while moving manufacturing risk into known-good-die supply, package assembly and die-to-die integration."
my_take: "I should not assume chiplets create yield for free; I should compare equal total silicon area, identify what can be tested and salvaged, model every required component and assembly step, include interconnect-power-thermal penalties, and calculate cost per good package rather than single-die yield."

