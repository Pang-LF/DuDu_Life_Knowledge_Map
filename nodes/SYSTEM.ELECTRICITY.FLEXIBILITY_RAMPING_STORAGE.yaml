id: "SYSTEM.ELECTRICITY.FLEXIBILITY_RAMPING_STORAGE"
name_en: "Flexibility, Ramping and Storage"
name_zh: "灵活性、爬坡与储能"
domain: "SYSTEM"
module: "Energy Systems（能源系统）"
importance: "Core"
mastery_current: "L0"
mastery_candidate: "L1"

what: "Electricity-system flexibility is the ability of a resource or portfolio to change net injection or withdrawal in a specified direction, location and time, at the required ramp rate and duration, while remaining able to recover for the next need."
why: "A scheduled or priced deviation is not corrected unless a physically reachable resource can change MW quickly enough and sustain the change; MW, MWh, ramp rate, duration, and state are not interchangeable."
mechanism: "Generators, storage, demand response, and interconnectors move from a current operating point along technology-specific ramp and energy-state constraints; fast resources contain the deviation, sustained resources carry it, and replacement actions rebuild headroom, fuel, or state of charge."
example: "Hornsdale Power Reserve began with 100 MW discharge, 80 MW charge, and 129 MWh storage, roughly 75 minutes at full output. It responded as expected to a 689 MW generation trip in December 2017 while also following AGC set-points and participating in energy and all eight NEM FCAS markets."
my_take: "I should specify direction, baseline, MW, start time, ramp rate, duration, location, state of charge or fuel, recovery, and correlated failure before calling any resource flexible."

