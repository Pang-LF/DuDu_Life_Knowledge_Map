id: "SYSTEM.ELECTRICITY.CAPACITY_ACCREDITATION_ELCC"
name_en: "Capacity Accreditation and ELCC"
name_zh: "容量认证与有效负荷承载能力"
domain: "SYSTEM"
module: "Energy Systems（能源系统）"
importance: "Core"
mastery_current: "L0"
mastery_candidate: "L1"

what: "Capacity accreditation converts nameplate MW into reliable MW by measuring how much the next increment of a resource reduces portfolio reliability risk in the modeled scarcity hours relative to perfectly reliable capacity."
why: "The same 100 MW can contribute very different reliability value depending on output timing, outages, duration, correlated weather, fuel, network conditions, and the resources already in the portfolio."
mechanism: "Model the expected portfolio at the target reliability level, add a perfect capacity increment and measure its EUE reduction, replace it with the resource class increment, divide the class risk reduction by the perfect-resource reduction, and apply any unit-specific performance adjustment."
example: "For PJM's final 2026/27 3IA ratings, 100 MW of fixed solar represented about 10 accredited MW, four-hour storage 54 MW, ten-hour storage 73 MW, gas combined cycle 77 MW, and nuclear 95 MW. The values answer a conditional portfolio-risk question, not an all-purpose technology ranking."
my_take: "I should treat every capacity credit as a versioned model output: which portfolio, scarcity distribution, reliability metric, weather and outage data, resource class, duration, performance adjustment, and marginal-versus-average question produced it?"

