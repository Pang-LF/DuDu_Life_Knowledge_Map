id: "SYSTEM.COMPUTE.CLOUD_ARCHITECTURE_INTEGRATION_DISASTER_RECOVERY"
name_en: "Cloud Architecture Integration and Disaster Recovery"
name_zh: "云架构整合与灾难恢复"
domain: "SYSTEM"
module: "Compute Systems（计算系统）"
importance: "Core"
mastery_current: "L0"
mastery_candidate: "L1"

what: "Cloud disaster recovery is an exercised architecture state transition that detects and scopes a named disaster, authorizes failover, establishes sufficiently fresh writable state, available identity and configuration, reachable network paths and sufficient compute capacity, then validates a complete business function within measured RTO and RPO."
why: "A second Region, replica, backup or standby resource is only potential recovery capacity: shared credentials, broken restore procedures, stale state, missing dependencies, insufficient quota, unreachable routing or untested human decisions can prevent it from becoming a valid service."
mechanism: "Define the business function and disaster, then trace Detect, Scope, Decide, Prepare State, Prepare Service, Route and Validate; inventory compute, failure domains, data, queues, external side effects, identity, certificates, configuration and operational access; compare backup-and-restore, pilot light, warm standby and active-active by what is completed before failure and verify the result through game days."
example: "In GitLab.com's 2017 database incident, a primary deletion occurred while the standby was being rebuilt, logical backups had silently failed, database disk snapshots were absent and only a six-hour-old staging LVM snapshot remained; slow storage then helped extend recovery to roughly 18 hours."
my_take: "I should accept a disaster-recovery claim only after one named business transaction has been recovered under a named failure, with actual state age, capacity, identity, route, validation, RTO and RPO evidence rather than resource inventory or architecture diagrams."

