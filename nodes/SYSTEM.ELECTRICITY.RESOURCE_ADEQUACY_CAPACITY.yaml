id: "SYSTEM.ELECTRICITY.RESOURCE_ADEQUACY_CAPACITY"
name_en: "Resource Adequacy and Capacity"
name_zh: "资源充裕度与容量"
domain: "SYSTEM"
module: "Energy Systems（能源系统）"
importance: "Core"
mastery_current: "L0"
mastery_candidate: "L1"

what: "Resource adequacy is the ex-ante probability that a portfolio can serve load and required reserves across critical periods after accounting for demand uncertainty, outages, weather correlation, duration, location, fuel, imports, and network deliverability."
why: "Installed nameplate MW can be abundant while too little capability is available in the actual risk hour; reliability requires a portfolio whose time, location, duration, and failure modes match the stress."
mechanism: "Forecast critical load shapes, add a planning reserve for uncertainty, accredit each resource by its dependable contribution, test correlated weather and outage states across hours and locations, procure remaining needs, and impose availability and performance obligations."
example: "California's August 2020 obligation totaled 51,413 MW and was fully represented by shown RA, RMR, and credits, yet rotating outages occurred near evening net-demand peaks when heat, outages, declining solar, import scarcity, and market scheduling jointly tightened deliverable supply."
my_take: "I should replace every capacity total with a conditional question: available when, for how long, where, under which weather and outage state, through which network, and with what probability?"

