id: "SYSTEM.ENERGY.FOUNDATION"
name_en: "Energy System Foundation"
name_zh: "能源系统基础"
domain: "SYSTEM"
module: "Energy Systems（能源系统）"
importance: "Core"
mastery_current: "L0"
mastery_candidate: "L1"

what: "An energy system is the resources, conversion equipment, transport and network infrastructure, operating rules, markets, institutions, and end-use devices that transform primary energy into useful services at a required time and place."
why: "Resource abundance, annual production, and installed capacity do not by themselves guarantee heat, motion, light, cooling, or computation; service depends on the complete conversion chain remaining executable."
mechanism: "Primary energy is converted into carriers such as electricity or refined fuels, delivered through networks, and transformed by end-use devices into services. Physical flow, information and control, and money and rights must remain coordinated across quantity, rate, location, timing, and quality constraints."
example: "During the February 2021 Texas freeze, abundant energy resources did not prevent more than 4.5 million residents from losing power because cold simultaneously increased demand and impaired natural gas production, fuel delivery, generating units, and grid operations."
my_take: "When evaluating an energy claim, I should ask which layer the number describes and follow one unit from primary energy to the actual service people need."

