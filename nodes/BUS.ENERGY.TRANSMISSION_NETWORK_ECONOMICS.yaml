id: "BUS.ENERGY.TRANSMISSION_NETWORK_ECONOMICS"
name_en: "Transmission Network Economics"
name_zh: "输电网络经济学"
domain: "BUSINESS"
module: "Industry Atlas（产业图谱）"
importance: "Core"
mastery_current: "L0"
mastery_candidate: "L1"

what: "Transmission network economics evaluates how a line or grid technology changes reliability, feasible dispatch, congestion, losses, capacity needs, extreme-condition flexibility, and future options, then allocates costs among beneficiaries."
why: "A transmission asset does not produce MWh and may be lightly used in ordinary hours, yet can create large option value after outages or enable lower-cost generation; average utilization therefore does not measure complete value."
mechanism: "Transmission owners finance and maintain regulated network assets, system operators coordinate their use, planners compare projects with redispatch, storage, demand response, local generation, topology, and grid-enhancing alternatives, and regulators or tariffs determine cost recovery using estimated beneficiaries and benefits."
example: "The 2003 Northeast blackout showed that losing network paths can remove the feasible post-contingency state even when aggregate generation exists. Modern FERC long-term planning rules require multiple scenarios and consideration of reliability, production-cost, congestion, loss, extreme-condition, capacity, and replacement benefits."
my_take: "I should value a transmission project by the network constraint and counterfactual portfolio it changes, identify each beneficiary and settlement metric, and keep owner revenue separate from total system benefit and congestion settlement."

