id: "BUS.SEMICONDUCTOR.ACCELERATOR_PLATFORM_ECONOMICS"
name_en: "Accelerator Platform Economics"
name_zh: "加速器平台经济学"
domain: "BUSINESS"
module: "Industry Atlas（产业图谱）"
importance: "Core"
mastery_current: "L0"
mastery_candidate: "L1"

what: "Accelerator platform economics concerns how hardware, drivers, compilers, runtimes, optimized libraries, frameworks, developer skills and installed applications combine into usable compute and create switching costs beyond a chip purchase."
why: "Customers buy time-to-solution and reliable workload deployment, so platform coverage, porting effort, qualification, availability and developer productivity can carry more economic weight than isolated peak specifications."
mechanism: "A vendor invests in processor architecture and a software stack; cloud, OEM and system partners distribute hardware and instances; framework and application teams build against platform interfaces; optimized libraries shorten deployment and improve utilization; accumulated code, tools, skills and validation raise migration time and risk, while competing hardware and open or portable software constrain platform power."
example: "NVIDIA introduced CUDA in 2006 and describes its current platform as GPUs plus CUDA, hundreds of libraries, frameworks, SDKs and APIs; AlexNet demonstrates how optimized GPU software, selective communication and hardware capacity jointly expanded feasible model training."
my_take: "I should evaluate accelerator power through workload coverage, time-to-solution, throughput per dollar and watt, library maturity, porting and qualification time, installed base and credible alternatives, not infer lock-in or pricing power from CUDA usage alone."

