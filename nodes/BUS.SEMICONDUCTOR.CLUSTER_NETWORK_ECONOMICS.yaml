id: "BUS.SEMICONDUCTOR.CLUSTER_NETWORK_ECONOMICS"
name_en: "Cluster Network Economics"
name_zh: "集群网络经济学"
domain: "BUSINESS"
module: "Industry Atlas（产业图谱）"
importance: "Core"
mastery_current: "L0"
mastery_candidate: "L1"

what: "Cluster network economics connects NICs and DPUs, switch ASICs, optics and cabling, fabric topology, routing, telemetry, collective libraries, scheduling and operations to job completion time, accelerator idle cost, failure headroom and customer service obligations."
why: "A cheaper oversubscribed fabric can be efficient for dispersed traffic yet strand expensive synchronized compute, while a non-blocking fabric can waste capital and power if workloads do not consume its headroom; value therefore depends on named communication patterns and failure states."
mechanism: "Trace capital and service payments from cloud or data-center buyers through server, network, optical, software and operations suppliers; compare normal and degraded injection, bisection, latency and collective performance; translate exposed communication into idle accelerator hours and cost per useful output; then include qualification, migration, support and private contract boundaries."
example: "Meta described starting its modular data-center fabric at 4:1 rack-to-rack oversubscription and adding spines toward 2:1 or 1:1 as demand grew, while AWS describes cluster placement groups and EFA as service boundaries for tightly coupled workloads requiring non-oversubscribed full-bisection connectivity and lower, more consistent latency."
my_take: "I should value a fabric by the workload and failure states in which its headroom shortens jobs or prevents stranded accelerators, while keeping confidential prices, discounts, margins and liability terms separate from public technical capability."

