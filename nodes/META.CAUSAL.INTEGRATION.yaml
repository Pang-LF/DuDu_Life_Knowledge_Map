id: "META.CAUSAL.INTEGRATION"
name_en: "Causal Reasoning Integration"
name_zh: "因果推理整合"
domain: "META"
module: "Causal Reasoning（因果推理）"
importance: "Core"
mastery_current: "L0"
mastery_candidate: "L2"

what: "Causal reasoning integration is a disciplined audit of a comparison: define the intervention and outcome, establish direction, state the missing counterfactual, inspect treatment assignment and observation gates, then limit the conclusion to the effect that design can identify."
why: "Correlation, confounding, counterfactuals, and selection are not independent warning labels. They protect different parts of the same attempt to use an observed group as a substitute for an unobserved potential outcome."
mechanism: "Specify unit, intervention, outcome, and time; test temporal and reverse direction; write Y(1) and Y(0); identify pre-treatment common causes of assignment; map every gate into measurement and analysis; justify the comparison group; state the estimand, population, period, assumptions, and boundaries."
example: "In the randomized placebo areas of the 1954 Salk polio trial, vaccinated and placebo children passed the same parental-consent gate and were assigned by chance. Paralytic polio rates were 16 versus 55 per 100,000, implying about 71% relative efficacy. Non-inoculated children had a lower rate of 36 despite no vaccine, showing why an unrandomized untreated group was not an equivalent counterfactual."
my_take: "Before accepting a causal difference, I should explain why this particular control group can stand in for the treated group's missing outcome and what selection or measurement boundary remains."

