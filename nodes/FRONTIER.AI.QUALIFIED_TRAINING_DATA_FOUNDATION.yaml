id: "FRONTIER.AI.QUALIFIED_TRAINING_DATA_FOUNDATION"
name_en: "Qualified Training Data Foundation"
name_zh: "合格训练数据基础"
domain: "FRONTIER"
module: "Artificial Intelligence（人工智能）"
importance: "Core"
mastery_current: "L0"
mastery_candidate: "L1"

what: "Qualified training data is a versioned set of records admitted to influence model parameters for a named objective after explicit provenance, rights, extraction, integrity, relevance, deduplication, safety, representation, split, contamination and reproducibility gates."
why: "A crawled or stored object is not automatically true, lawful, representative, parseable or useful; every curation rule reduces some failure modes while changing which sources and expressions receive training weight."
mechanism: "Follow one raw record from capture and stable identity through rights review, task-specific extraction, classification, filtering, deduplication or weighting, label-status declaration, train-validation-test separation, contamination checks and a versioned manifest that supports audit, deletion and rebuild."
example: "Google's C4 pipeline transformed an April 2019 Common Crawl snapshot with sentence, length, blocklist, code, duplicate-span and English-probability rules; filtered C4 was much smaller and performed better than the unfiltered variant on the T5 paper's listed tasks, while later audits found benchmark overlap and disproportionate exclusions."
my_take: "I should treat every phrase such as high-quality data as an unverified claim until the objective, qualification gates, removed population, version, error audit and evidence boundary are explicit."

