id: "META.PROBABILITY.BASE_RATE"
name_en: "Base Rate"
name_zh: "基础概率"
domain: "META"
module: "Probability & Bayesian Thinking（概率与贝叶斯思维）"
importance: "Core"
mastery_current: "L0"
mastery_candidate: "L2"

what: "A base rate is the prevalence or starting probability of a target event in a relevant reference class before case-specific evidence is incorporated."
why: "When the target event is rare, even a small false-positive rate applied to a large non-target population can create more alerts than true detections. Ignoring the starting pool sizes makes vivid evidence look more decisive than it is."
mechanism: "Define the target event and defensible reference class; count target and non-target pools; apply the signal's detection rate to the target pool and false-positive rate to the non-target pool; compare both sources of positive signals before interpreting an individual alert."
example: "Among 871 asymptomatic paired samples at two Wisconsin universities in 2020, 17 were RT-PCR positive, a base rate of about 2%. The antigen test produced seven true positives and 14 false positives, so only 7 of 21 antigen-positive results, or 33.3%, were also RT-PCR positive despite 98.4% specificity."
my_take: "Before reacting to an alert, I should identify the relevant reference class and make the true-detection and false-alarm pools visible."

