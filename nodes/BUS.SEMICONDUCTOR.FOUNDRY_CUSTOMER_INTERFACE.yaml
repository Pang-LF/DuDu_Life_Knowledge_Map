id: "BUS.SEMICONDUCTOR.FOUNDRY_CUSTOMER_INTERFACE"
name_en: "Fabless-Foundry Design and Responsibility Interface"
name_zh: "无晶圆厂设计公司与晶圆代工厂的设计及责任接口"
domain: "BUSINESS"
module: "Industry Atlas（产业图谱）"
importance: "Core"
mastery_current: "L0"
mastery_candidate: "L1"

what: "The fabless-foundry interface allocates product design, licensed IP, EDA tools, process technology, PDK versions, signoff evidence, masks, manufacturing execution, yield diagnosis, change control, payment and liability among customers, foundries and ecosystem partners."
why: "A foundry does not merely print customer drawings, and a customer does not acquire the process recipe by receiving a PDK; successful silicon requires coherent technical baselines, contract-specific ownership and disciplined attribution when design, data, process, mask, packaging or test failures occur."
mechanism: "The customer funds design, verification, EDA, IP, masks or NRE, engineering lots and production demand; the foundry funds process R&D, facilities, equipment, control and manufacturing. Each party verifies the objects it controls, while interface data, waivers, revisions, yield attribution, mask rights, respins and remedies are governed by acceptance procedures and contracts."
example: "The open SKY130 program separated roles visibly: SkyWater supplied process and foundry support, Google sponsored the program, Efabless supplied submission and RTL-to-GDS infrastructure, and designers supplied open projects that had to pass license, integrity and DRC gates before sharing a 40-slot shuttle."
my_take: "I should trace who owns or licenses each design and process artifact, who can change it, who verifies it, who pays before and after tape-out, and which evidence distinguishes a design bug from process nonconformance or ambiguous yield loss."

