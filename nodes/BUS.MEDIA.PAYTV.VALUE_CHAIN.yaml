id: "BUS.MEDIA.PAYTV.VALUE_CHAIN"
name_en: "Pay-TV Value Chain"
name_zh: "付费电视价值链"
domain: "BUSINESS"
module: "Subscription Video / Pay-TV / Streaming（订阅视频 / 付费电视 / 流媒体）"
importance: "Core"
mastery_current: "L0"
mastery_candidate: "L1"

what: "A system linking consumers, distributors, programmers, studios or rights holders, advertisers, and device platforms through content, payment, attention, and customer relationships."
why: "No single actor normally owns the entire path from original content rights to the household screen."
mechanism: "Rights holders supply content; programmers organize channels; distributors aggregate and deliver them; households pay for access; advertisers pay for attention."
example: "A sports league licenses a game, a programmer places it on a channel, and DIRECTV carries that channel inside a household package."
my_take: "Industry power cannot be understood before separating ownership of content, customer relationships, distribution, and attention."

