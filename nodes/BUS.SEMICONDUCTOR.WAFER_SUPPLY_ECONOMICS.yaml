id: "BUS.SEMICONDUCTOR.WAFER_SUPPLY_ECONOMICS"
name_en: "Semiconductor Wafer Supply Economics"
name_zh: "半导体晶圆供应经济学"
domain: "BUSINESS"
module: "Industry Atlas（产业图谱）"
importance: "Core"
mastery_current: "L0"
mastery_candidate: "L1"

what: "Wafer supply economics concern the capital, process know-how, qualification, product mix, utilization and contracts required to deliver fab-ready substrates of a specified diameter, structure, electrical range, geometry and defect level."
why: "A fab pays for predictable process performance and yield rather than kilograms of silicon; therefore qualified capacity, switching cost and long investment cycles can create concentration and bargaining power even when the underlying element is abundant."
mechanism: "Wafer suppliers commit capital and operate crystal growth, slicing, polishing, cleaning, specialty processing and metrology; customers qualify exact products and may provide long-term demand or financing; price and power reflect product-specific scarcity, yield impact, switching time, utilization and contract risk."
example: "Commerce supported roughly USD 4 billion of GlobalWafers projects with up to USD 406 million in milestone-based funding. After the Sherman facility opened, Micron announced proposed USD 500 million strategic financing and a ten-year supply agreement for access to 300mm capacity."
my_take: "I should separate theoretical wafer equipment capacity from customer-qualified capacity and ask who funds expansion, who bears underutilization or demand risk, what product is reserved and what physical or contractual event proves supply."

