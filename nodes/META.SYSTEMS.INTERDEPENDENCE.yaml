id: "META.SYSTEMS.INTERDEPENDENCE"
name_en: "Interdependence"
name_zh: "相互依赖"
domain: "META"
module: "Systems Thinking（系统思维）"
importance: "Core"
mastery_current: "L0"
mastery_candidate: "L2"

what: "A component's ability to perform depends on the state, timing, location, and coordination of other components."
why: "System capability often exists in executable combinations among parts rather than in the isolated health or quantity of each part."
mechanism: "Resources create output only when their constraints and relationships are simultaneously satisfied. A mismatch can make individually healthy resources collectively unusable."
example: "A serviceable aircraft and a legal crew cannot operate a flight when they are in different cities or their schedules do not align."
my_take: "Local health is weak evidence of system health when output requires coordinated matching."

