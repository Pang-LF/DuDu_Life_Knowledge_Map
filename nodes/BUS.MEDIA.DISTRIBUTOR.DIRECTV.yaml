id: "BUS.MEDIA.DISTRIBUTOR.DIRECTV"
name_en: "DIRECTV as Distributor and Aggregator"
name_zh: "DIRECTV 的分发与聚合角色"
domain: "BUSINESS"
module: "Subscription Video / Pay-TV / Streaming（订阅视频 / 付费电视 / 流媒体）"
importance: "Core"
mastery_current: "L0"
mastery_candidate: "L1"

what: "DIRECTV packages licensed content into a household service and controls important customer, billing, service, discovery, and product relationships."
why: "Understanding the boundary between ownership, licensed access, and coordination is necessary before analyzing bundles, carriage negotiations, or cord cutting."
mechanism: "DIRECTV contracts for distribution rights, designs packages and product interfaces, delivers service by satellite or internet, bills subscribers, and integrates some third-party apps while depending on programmers, rights holders, internet providers, and separate subscriptions."
example: "Gemini can place DIRECTV programming and third-party streaming apps in one interface, while some third-party apps still require separately paid subscriptions."
my_take: "DIRECTV's core asset is not ownership of every program; it is the capability and customer permission to organize other parties' content into a usable product."

