id: "META.FORECASTING.FOUNDATION"
name_en: "Forecasting Foundation"
name_zh: "预测基础"
domain: "META"
module: "Forecasting（预测）"
importance: "Core"
mastery_current: "L0"
mastery_candidate: "L1"

what: "A forecast is a pre-outcome probability judgment about an exact future event, with a fixed horizon, resolution source and information cutoff."
why: "Without a frozen record, hindsight can rewrite the event, probability or rationale, making calibration and learning impossible. A low-probability event occurring does not by itself show that the probability was wrong."
mechanism: "Define a binary or otherwise measurable event; specify the deadline and authoritative resolution source; record the probability and information cutoff before resolution; settle the outcome without changing the definition; score the record; then evaluate calibration across many comparable forecasts."
example: "FiveThirtyEight's final 2016 model assigned Donald Trump a 28.6% chance of winning. He won 304 electoral votes, so the event resolved true. The outcome gives this record a binary score but cannot alone determine whether 28.6% was calibrated."
my_take: "I should turn vague future claims into dated forecast records and preserve the original probability, then separate outcome settlement, single-record scoring and long-run calibration."

