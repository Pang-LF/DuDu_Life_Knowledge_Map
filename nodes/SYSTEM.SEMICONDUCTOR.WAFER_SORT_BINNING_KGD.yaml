id: "SYSTEM.SEMICONDUCTOR.WAFER_SORT_BINNING_KGD"
name_en: "Wafer Sort, Binning and Known Good Die"
name_zh: "晶圆测试、分档与已知良品裸片"
domain: "SYSTEM"
module: "Compute Systems（计算系统）"
importance: "Core"
mastery_current: "L0"
mastery_candidate: "L1"

what: "Wafer sort applies a versioned test program, electrical conditions and decision limits to each die before packaging, then records pass, fail and parametric bins; a known-good die is accepted under that bounded evidence rather than proven universally reliable."
why: "Testing determines which fabricated die deserve further packaging investment, which sellable specification each accepted die can support, and how much defect and reliability risk moves downstream into packages, systems and customers."
mechanism: "Use probe cards and automated test equipment to contact die; apply structural, functional, memory and parametric patterns; compare observations with limits; classify true rejects, accepted die, performance bins and retest candidates; record a wafer map; then use final test, reliability sampling and field feedback to find coverage gaps and update the test flow."
example: "NVIDIA disclosed that certain previously shipped notebook MCP and GPU configurations failed in the field at higher than normal rates despite having reached customers; candidate contributors included a weak die-package material combination, system thermal design and use patterns, showing that production-test pass and lifetime system reliability are different claims."
my_take: "When I see a test-yield or KGD claim, I should identify the physical stage, test program, conditions, limits, fault model and denominator; separate false rejects from escapes; inspect bin mix and retest; and ask how a late failure multiplies downstream value loss."

