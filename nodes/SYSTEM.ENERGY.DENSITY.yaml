id: "SYSTEM.ENERGY.DENSITY"
name_en: "Energy and Power Density"
name_zh: "能量与功率密度"
domain: "SYSTEM"
module: "Energy Systems（能源系统）"
importance: "Core"
mastery_current: "L0"
mastery_candidate: "L1"

what: "Energy density states how much usable energy is stored per unit mass or volume, while power density states how quickly energy can be delivered per unit mass, volume, or area; the denominator must always be explicit."
why: "Energy services require physical assets. Density determines mass, volume, land, storage, network, and payload burdens that efficiency alone cannot eliminate."
mechanism: "Start from the service's usable energy and peak or continuous power; divide each by the relevant mass, volume, or area; include safety packaging, conversion losses, redundancy, reserves, and duration; then identify which physical denominator constrains the task."
example: "NASA's X-57 Maxwell carried about 390 kg of batteries for 47 kWh usable energy and a roughly 145 kW peak mission requirement. The efficient electric powertrain reduced energy demand, but system-level density reshaped seating, wing design, high-lift propulsion, thermal safety, and certification."
my_take: "I should never rank an energy technology by one laboratory density number; I should name the denominator, use system-level usable performance, and match total energy and delivery rate to the actual service."

