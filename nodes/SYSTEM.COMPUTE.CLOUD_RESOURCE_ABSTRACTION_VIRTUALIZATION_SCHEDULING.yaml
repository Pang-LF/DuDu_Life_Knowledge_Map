id: "SYSTEM.COMPUTE.CLOUD_RESOURCE_ABSTRACTION_VIRTUALIZATION_SCHEDULING"
name_en: "Cloud Resource Abstraction, Virtualization and Scheduling"
name_zh: "云资源抽象、虚拟化与调度"
domain: "SYSTEM"
module: "Compute Systems（计算系统）"
importance: "Core"
mastery_current: "L0"
mastery_candidate: "L1"

what: "Cloud resource management turns heterogeneous physical compute, memory, accelerators, storage and network paths into productized virtual resources, then admits, filters, scores and places each complete request only where every resource, location, topology, policy, reservation and failure-domain constraint is simultaneously feasible."
why: "Aggregate free CPU, memory or accelerators do not guarantee sellable capacity: resources can be split across hosts, reserved for others, inaccessible in the requested zone or incompatible with the requested shape, while quota and actual usage describe different boundaries."
mechanism: "Follow one request from identity and quota admission through instance shape, host eligibility filters, placement scoring, hypervisor or container allocation and runtime telemetry; distinguish request, limit, reservation, allocation and usage, and test whether overcommit safely reclaims non-coincident slack or creates correlated contention."
example: "Google's 2015 Borg paper reported that separating production and non-production work would require 20-30% more machines in the median sampled cell, while rounding fine-grained CPU and memory requests into fixed power-of-two buckets would require 30-50% more resources in the median case."
my_take: "I should ask whether a named request has at least one feasible host, not whether fleet totals look underused, and require scheduler filter reasons, host inventory, reservation maps and usage traces before diagnosing shortage or waste."

