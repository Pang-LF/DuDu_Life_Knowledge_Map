id: "SYSTEM.ENERGY.CAPACITY_FACTOR_UTILIZATION"
name_en: "Capacity Factor and Utilization"
name_zh: "容量因子与利用率"
domain: "SYSTEM"
module: "Energy Systems（能源系统）"
importance: "Core"
mastery_current: "L0"
mastery_candidate: "L1"

what: "Capacity factor is actual electrical energy generated during a period divided by rated capacity multiplied by the hours in that period; it measures how much theoretical output capability became delivered energy."
why: "Installed megawatts do not reveal annual megawatt-hours, and a high or low capacity factor does not by itself identify availability, resource limits, dispatch, network constraints, profitability, reliability, or social value."
mechanism: "Convert rated power into maximum potential energy using the same time window, compare actual generation with that denominator, then separately investigate physical availability, resource availability, economic dispatch, and network or system constraints."
example: "EIA historical data record Three Mile Island Unit 1 producing 6,633,750 MWh from 805 MW of net summer capacity, about a 94% capacity factor, yet the plant retired in 2019 after financial losses and repeated capacity-auction failures."
my_take: "I should use capacity factor to measure realized utilization, then ask why the remaining theoretical output was not produced and whether the actual output earned enough to cover the complete asset."

