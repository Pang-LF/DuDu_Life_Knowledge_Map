id: "BUS.ENERGY.WHOLESALE_MARKET_LOCATIONAL_PRICING"
name_en: "Wholesale Market Locational Pricing"
name_zh: "批发市场位置定价"
domain: "BUSINESS"
module: "Industry Atlas（产业图谱）"
importance: "Core"
mastery_current: "L0"
mastery_candidate: "L1"

what: "Locational marginal pricing settles the marginal value of energy at defined resource, hub, or load settlement points after security-constrained dispatch accounts for transmission congestion and marginal losses."
why: "One uniform wholesale price would hide the cost of delivering the next MWh through a constrained network and would weaken signals for redispatch, generation, flexible load, storage, and transmission location."
mechanism: "The ISO or RTO clears offers and bids through a network model; generators are credited at applicable resource-node prices, load is charged at applicable load-zone or settlement-point prices, and congestion differences are allocated through market rules and financial transmission rights rather than automatically becoming transmission-owner profit."
example: "ERCOT launched its nodal market on 1 December 2010 with locational marginal prices at more than 8,000 nodes, day-ahead co-optimization of energy and ancillary services, reliability unit commitment, and congestion revenue rights."
my_take: "I should separate physical dispatch, wholesale settlement, hedge allocation, regulated network cost recovery, and the final retail bill instead of treating an LMP spread as one party's simple profit."

