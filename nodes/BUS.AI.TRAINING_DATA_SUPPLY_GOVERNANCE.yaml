id: "BUS.AI.TRAINING_DATA_SUPPLY_GOVERNANCE"
name_en: "Training Data Supply and Governance"
name_zh: "训练数据供应与治理"
domain: "BUSINESS"
module: "Industry Atlas — Artificial Intelligence"
importance: "Applied"
mastery_current: "L0"
mastery_candidate: "L1"

what: "Training-data supply and governance maps how creators, platforms, archives, licensors, dataset builders, annotators, infrastructure providers, model labs and the public allocate access, rights, curation cost, control, deletion duties and residual risk."
why: "Free access to web bytes does not pay for provenance, licensing review, extraction, filtering, deduplication, annotation, contamination testing, auditing, deletion or corpus rebuild, and it does not establish uniform rights or quality."
mechanism: "Fix the training purpose and accepted record, trace content, metadata, money, rights and risk across every participant, distinguish access from license and suitability, then identify which qualified inputs or governance interfaces remain difficult to substitute."
example: "Common Crawl makes its archive freely accessible with AWS sponsorship, while a model lab still pays engineering, compute, review and governance costs to transform web records into a versioned corpus such as C4; creators and the public can retain rights or risks that free archive access does not resolve."
my_take: "I should ask who controls the original record, the usage permission, the curation rule, the model-training decision and the deletion path before treating data volume as an owned asset or a zero-cost input."

