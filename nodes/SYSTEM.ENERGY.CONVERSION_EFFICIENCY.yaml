id: "SYSTEM.ENERGY.CONVERSION_EFFICIENCY"
name_en: "Conversion Efficiency and Losses"
name_zh: "转换效率与损失"
domain: "SYSTEM"
module: "Energy Systems（能源系统）"
importance: "Core"
mastery_current: "L0"
mastery_candidate: "L1"

what: "Conversion efficiency is the fraction of energy input that becomes a specifically defined useful output inside an explicit boundary; energy outside that numerator is conserved but often exits as lower-quality heat, friction, resistance, auxiliary consumption, or other non-target flows."
why: "Efficiency percentages are comparable only when input, useful output, system boundary, time and accounting conventions such as LHV versus HHV and gross versus net are aligned."
mechanism: "Trace one unit of input across every output path; identify which output serves the target; distinguish energy quantity from its ability to do work; multiply sequential efficiencies; and test whether recovering another loss stream is worth the added asset, operation, and complexity."
example: "Nishi-Nagoya Unit 7-1 combines three gas turbines with one steam turbine. A heat-recovery steam generator uses hot gas-turbine exhaust to raise steam, bringing reported generation efficiency to 63.08 percent on an LHV basis in 2018."
my_take: "Whenever I see an efficiency claim, I should write the numerator, denominator, physical boundary, LHV or HHV basis, gross or net output, and actual operating condition before comparing it."

