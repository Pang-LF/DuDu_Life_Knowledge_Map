id: "BUS.MEDIA.INDUSTRY_INTEGRATION"
name_en: "Streaming Industry Integration"
name_zh: "流媒体行业整合"
domain: "BUSINESS"
module: "Subscription Video / Pay-TV / Streaming（订阅视频 / 付费电视 / 流媒体）"
importance: "Core"
mastery_current: "L0"
mastery_candidate: "L1"

what: "Industry integration connects rights, content, distribution, device access, pricing, advertising, billing, acquisition, retention, customer value and profitability into one forecastable system while keeping each claim separately measurable."
why: "A single subscriber total compresses heterogeneous markets, plans, channels and economics. Scale, profitability and strategic value can move in different directions and must not be settled with one metric."
mechanism: "Trace the chain from rights owner through content package, distributor and device to the household; separate subscriber stock from acquisition and churn flows; connect price, ads and bundles to ARPU; connect retention and contribution to LTV; state accounting scope and counterfactual before evaluating strategy."
example: "Disney guided in 2020 to 230-260 million Disney+ paid subscribers by FY2024. FY2024 Disney+ Core plus Hotstar totaled about 158.6 million, while the broader DTC segment reported $143 million operating income. The subscriber range was missed, but the broader profit measure cannot settle Disney+ standalone profitability or total strategic value."
my_take: "I should settle each industry forecast on its own defined metric and scope, then use a connected operating model rather than subscriber scale alone to judge value."

