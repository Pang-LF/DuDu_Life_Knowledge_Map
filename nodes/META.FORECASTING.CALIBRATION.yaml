id: "META.FORECASTING.CALIBRATION"
name_en: "Forecast Calibration"
name_zh: "概率校准"
domain: "META"
module: "Forecasting（预测）"
importance: "Core"
mastery_current: "L0"
mastery_candidate: "L2"

what: "Calibration measures whether events assigned probability x occur about x of the time across a sufficiently large, frozen and consistently resolved set of forecasts; resolution separately measures whether forecasts discriminate higher-risk from lower-risk events."
why: "One surprising outcome cannot reveal whether a probability was good, and a forecaster who always says 50% can appear calibrated while adding little information. Long-run records are required to diagnose systematic overconfidence, underconfidence and weak discrimination."
mechanism: "Freeze forecast records before outcomes; preserve every update; resolve events under original rules; score individual predictions; group comparable resolved forecasts into probability bins; compare stated probabilities with observed frequencies; inspect resolution, selection, dependence and sample size; convert systematic errors into process changes."
example: "In the 2011-2013 Good Judgment Project study, probability training, team collaboration and tracking improved forecasting performance. Early 100% predictions were correct only about 70% of the time, while late 100% predictions were correct about 90%, exposing persistent overconfidence at the extreme."
my_take: "I should judge probability skill from a complete record of many forecasts, not from one win or loss, and I should seek both frequency calibration and useful separation of events."

