id: "META.SOURCE_EVALUATION.INTEGRATION"
name_en: "Source Evaluation Integration"
name_zh: "信息源评估整合"
domain: "META"
module: "Cognitive Bias & Source Evaluation（认知偏差与信息源评估）"
importance: "Core"
mastery_current: "L0"
mastery_candidate: "L2"

what: "An epistemic audit traces a claim backward through event definition, sampling, instrumentation, calibration, synchronization, processing, statistics and inference, then uses independent diagnostic checks to update belief."
why: "Large samples and strong statistical significance can precisely reproduce a shared systematic error. Reliability depends on the whole evidence chain and the independence and diagnosticity of follow-up measurements, not source labels or sample size alone."
mechanism: "Freeze an independent prior; state the exact claim; reconstruct the measurement chain; mark assumptions and error directions; identify the component whose failure could generate the observed magnitude; derive predictions under competing explanations; seek checks that break shared failure paths; update each claim in proportion to the new evidence."
example: "OPERA's 2011 60.7 ns neutrino anomaly used 15,223 events over about 730 km and reached roughly six-sigma significance, yet a fibre-optic timing connection and oscillator effects biased the shared timing chain. Independent ICARUS timing and four Gran Sasso experiments in 2012 found results consistent with light speed."
my_take: "When evidence is surprising, I should not choose between institutional trust and reflexive disbelief; I should locate the shared measurement path and ask which independent check most changes the odds among competing explanations."

