id: "META.CAUSAL.COUNTERFACTUAL"
name_en: "Counterfactual"
name_zh: "反事实"
domain: "META"
module: "Causal Reasoning（因果推理）"
importance: "Core"
mastery_current: "L0"
mastery_candidate: "L2"

what: "A counterfactual is the unobserved outcome for the same unit, at the same time, under an alternative treatment state. An individual causal effect contrasts two potential outcomes, although only one can be observed."
why: "Every causal claim requires a missing comparison. Naming the counterfactual prevents an arbitrary observed group, past value, or convenient story from being treated as the outcome that would have occurred without the intervention."
mechanism: "Define the unit, treatment, outcome, and time; state Y(1) and Y(0); identify which is observed; then justify how a comparison group or design can estimate the missing outcome on average, keeping the estimand and assumptions explicit."
example: "Oregon's 2008 Medicaid lottery randomly assigned an opportunity to apply, creating a credible average counterfactual for the effect of that opportunity. Estimating actual coverage effects required using the lottery-induced 24.1-percentage-point coverage difference and additional assumptions."
my_take: "Before trusting a causal difference, I should state the missing outcome in one sentence and explain exactly why the comparison group can stand in for it."

