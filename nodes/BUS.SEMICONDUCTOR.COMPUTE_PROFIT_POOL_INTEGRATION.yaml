id: "BUS.SEMICONDUCTOR.COMPUTE_PROFIT_POOL_INTEGRATION"
name_en: "Compute Value-chain Profit-pool Integration"
name_zh: "计算价值链利润池整合"
domain: "BUSINESS"
module: "Industry Atlas — Semiconductor + Compute"
importance: "Applied"
mastery_current: "L0"
mastery_candidate: "L1"

what: "Compute profit-pool integration studies where operating profit can be retained across cloud software, data centers, networks, servers, accelerator platforms, memory, packaging, foundries, equipment and materials after each layer's capital, operating and risk costs."
why: "Revenue size, component cost share and engineering importance do not reveal profit: a layer retains value only if scarce qualified capability or customer control can be translated through contracts and interfaces after competition, capital, obsolescence and demand risk."
mechanism: "For a named workload, separate customer revenue, supplier revenue, provider cost, gross profit and operating profit; test indispensability, qualified scarcity, interface control, switching delay, customer control and risk absorption; then state the capacity, substitution or demand evidence that would move the bottleneck and reverse bargaining power."
example: "NVIDIA's data-center revenue rose from $830 million in FY2017 to $193.737 billion in FY2026 as its product boundary expanded toward systems, networking and software, while AWS Trainium shows a customer-owning cloud provider can move upstream to contest accelerator dependence and value retention."
my_take: "I should compare like accounting boundaries and ask who can preserve price, volume and return on invested capital after risk, rather than calling the highest-revenue or highest-gross-margin company the permanent winner."

