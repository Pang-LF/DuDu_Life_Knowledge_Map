id: "BUS.MEDIA.REAGGREGATION"
name_en: "Streaming Re-aggregation"
name_zh: "流媒体再聚合"
domain: "BUSINESS"
module: "Subscription Video / Pay-TV / Streaming（订阅视频 / 付费电视 / 流媒体）"
importance: "Core"
mastery_current: "L0"
mastery_candidate: "L1"

what: "Streaming re-aggregation recombines selected layers of otherwise independent services, such as pricing, billing, entitlement, discovery, device placement or support, while the services can retain separate brands, apps, content rights and parts of the customer relationship."
why: "DTC unbundling expanded choice and direct control but also multiplied acquisition, billing, discovery, cancellation and account-management costs. An aggregator can reduce these frictions and distribute services through an existing broadband, device or billing relationship."
mechanism: "Acquire a household through an existing relationship; sell an optional multi-service package; synchronize entitlements across partner apps; consolidate billing and sometimes discovery; settle undisclosed wholesale or revenue-share economics; measure incremental adoption, migration, retention, contribution and LTV against separate-purchase counterfactuals."
example: "Comcast launched StreamSaver in May 2024 for eligible Xfinity Internet or TV customers at $15 per month without an annual contract, combining Netflix Standard with Ads, Peacock Premium and Apple TV+ while the services remained separate apps."
my_take: "I should evaluate re-aggregation layer by layer: who controls acquisition, identity, billing, entitlement, discovery, usage data, cancellation and winback, and whether the bundle creates incremental cohort value rather than discounted migration."

