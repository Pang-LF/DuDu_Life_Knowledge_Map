id: "SYSTEM.COMPUTE.CLOUD_RELIABILITY_REGIONS_FAILURE_DOMAINS"
name_en: "Cloud Reliability, Regions and Failure Domains"
name_zh: "云可靠性、区域与故障域"
domain: "SYSTEM"
module: "Compute Systems（计算系统）"
importance: "Core"
mastery_current: "L0"
mastery_candidate: "L1"

what: "Cloud reliability is the ability of a complete user-facing service path to keep performing its agreed function under named failures; redundancy contributes only when replicas and dependencies do not share the relevant failure mechanism and failover can detect, decide, route and serve with valid state and capacity inside recovery objectives."
why: "Multiple running instances can share a rack, zone, regional metadata service, identity system, deployment, database or operator action, so component survival and replica count do not prove end-to-end availability."
mechanism: "Follow one request through reachability, compute, state and coordination; map Host, Rack, Availability Zone, Region, control-plane, software and organizational failure domains; test correlation rather than multiplying nominal failure probabilities; then verify detection, decision, routing, state freshness, spare capacity, RTO and RPO through exercised failover."
example: "During the 2017 Amazon S3 US-EAST-1 disruption, an incorrect command input removed too much capacity from regional index and placement subsystems. Object data redundancy across devices and Availability Zones did not bypass the shared metadata and placement dependencies required to serve S3 APIs."
my_take: "I should ask which exact user function must survive which failure, whether every hard dependency has an independent alternate path, and whether the full failover—not merely a standby VM—has been tested inside the promised time and data-loss boundaries."

