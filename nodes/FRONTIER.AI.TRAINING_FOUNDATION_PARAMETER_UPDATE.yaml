id: "FRONTIER.AI.TRAINING_FOUNDATION_PARAMETER_UPDATE"
name_en: "Training Foundation — Prediction, Loss, Gradient and Parameter Update"
name_zh: "训练基础——预测、损失、梯度与参数更新"
domain: "FRONTIER"
module: "Artificial Intelligence（人工智能）"
importance: "Core"
mastery_current: "L0"
mastery_candidate: "L1"

what: "A training step applies the current parameterized model to a qualified example, measures the output against an explicit objective, computes the loss's local sensitivity to shared parameters, and lets an optimizer update those parameters; the update is a local optimization action rather than a stored example or proof of generalization."
why: "Without separating prediction, loss, gradient, backpropagation, optimizer and evaluation, phrases such as the model learned hide which signal changed the parameters, what objective was optimized, and whether the change transferred beyond the training examples."
mechanism: "Follow one example through a forward prediction, scalar loss, chain-rule gradient calculation, batch aggregation, learning-rate and optimizer update, then compare training behavior with a genuinely held-out evaluation while auditing label, data, numerical and objective failures."
example: "AT&T Bell Labs trained a shared-weight handwritten ZIP-code network with 2,578 independent parameters controlling 98,442 connections; after 30 passes over 9,840 training examples it reported 1.1% training error versus 3.4% on 2,707 test examples, showing both reusable parameter learning and the boundary between fit and generalization."
my_take: "I should never accept training succeeded from a falling loss alone; I should identify the target, gradient and update rule, then require an independent evaluation that matches the capability and deployment boundary I care about."

