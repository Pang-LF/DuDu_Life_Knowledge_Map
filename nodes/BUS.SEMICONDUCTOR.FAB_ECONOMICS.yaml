id: "BUS.SEMICONDUCTOR.FAB_ECONOMICS"
name_en: "Foundry and Fab Economics"
name_zh: "晶圆代工与晶圆厂经济学"
domain: "BUSINESS"
module: "Industry Atlas（产业图谱）"
importance: "Core"
mastery_current: "L0"
mastery_candidate: "L1"

what: "Fab economics concern the capital, process technology, design interface, wafer starts, product mix, cycle time, yield, utilization, qualification and pricing required to convert customer designs into reliable processed wafers and good die."
why: "Two fabs with the same nominal wafer starts can deliver different good-die output, launch timing and total customer cost because process integration, yield, route complexity, utilization, qualification and switching time differ."
mechanism: "Customers fund design, masks, engineering lots and production orders; the fab funds facilities, tools, materials, utilities, maintenance, process R&D and depreciation; pricing and bargaining power reflect technology scarcity, process performance, yield, capacity, service, customer volume and alternatives."
example: "TSMC reported more than 17 million 12-inch-equivalent wafers of annual capacity, about 15.022 million shipments and US$40.895 billion of capital expenditure in 2025; its 59.9% gross margin was explicitly affected by utilization, price, cost improvement, mix, exchange rates and new-technology introduction."
my_take: "I should evaluate a foundry through design-to-good-die conversion rather than nominal wafer count, separating capacity, starts, work in process, shipments, yield, cycle time, mix, qualification and contract terms."

