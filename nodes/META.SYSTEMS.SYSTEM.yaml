name_en: "System"
name_zh: "系统"
domain: "META"
module: "Systems Thinking（系统思维）"
importance: "Core"
mastery_current: "L0"
mastery_candidate: "L2"

what: "A system is a set of elements, relationships, flows, and a purpose or function that produces behavior over time."
why: "Many important problems cannot be understood by listing parts alone; the relationships and flows between parts often explain outcomes."
mechanism: "Elements interact through relationships. Flows of information, money, energy, attention, people, or materials move through those relationships. The system's actual incentives reveal what it tends to optimize."
example: "A streaming business is not only an app plus content library; it is a system of subscribers, content rights, pricing, device platforms, advertising, churn, retention, and bargaining power."
my_take: "When a system's stated purpose and actual rewards diverge, actual rewards usually explain behavior better."

