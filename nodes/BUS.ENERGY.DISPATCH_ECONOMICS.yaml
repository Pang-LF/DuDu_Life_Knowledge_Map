id: "BUS.ENERGY.DISPATCH_ECONOMICS"
name_en: "Dispatch Economics"
name_zh: "调度经济学"
domain: "BUSINESS"
module: "Industry Atlas（产业图谱）"
importance: "Core"
mastery_current: "L0"
mastery_candidate: "L1"

what: "Dispatch economics explains when a technically available generator is selected to run and how energy, capacity, ancillary-service, contract, and environmental-attribute revenues interact with variable, fixed, capital, and financing costs."
why: "A generator can run frequently and still lose money, or run rarely while providing valuable peak capacity and flexibility; generation volume alone does not reveal the service sold or whether complete costs are recovered."
mechanism: "Separate MW capability from MWh output; identify availability, offers, variable cost, start and ramp limits, transmission constraints, and system need; then assemble the revenue stack and compare it with variable, fixed, capital, and contractual obligations."
example: "TMI-1 maintained high utilization but retired after prolonged low wholesale prices, five years of reported losses, and three failed PJM capacity auctions; a later 20-year Microsoft PPA changed the proposed restart's revenue certainty without replacing engineering and regulatory requirements."
my_take: "I should ask which electricity product is being sold, at what time scale, under which market or contract, and whether the complete revenue stack covers the complete cost stack."

