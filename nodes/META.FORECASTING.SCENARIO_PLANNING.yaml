id: "META.FORECASTING.SCENARIO_PLANNING"
name_en: "Scenario Planning"
name_zh: "情景规划"
domain: "META"
module: "Forecasting（预测）"
importance: "Core"
mastery_current: "L0"
mastery_candidate: "L1"

what: "Scenario planning separates predetermined elements from critical uncertainties, then builds a small set of causally coherent possible worlds with distinguishing signals, robust actions and contingent update rules."
why: "A single forecast can hide structural disagreements about how the future is generated. Scenario planning expands the model space before probability estimates are calibrated and reduces dependence on one official future."
mechanism: "Frame a decision-specific focal question and horizon; identify high-inertia predetermined elements; choose uncertainties that are both highly consequential and genuinely unresolved; build distinct causal stories; name confirming and disconfirming signals; stress-test options across worlds; act on robust choices and stage contingent choices until signals strengthen."
example: "Shell's 1971-1973 scenarios explored changes in producer-government behavior, OPEC power and possible Middle East disruption before the 1973 embargo. They did not predict the exact war, timing or $11.65 posted price, but let managers rehearse a world in which the old oil-supply regime failed."
my_take: "I should use scenarios to expose different causal mechanisms and precommit evidence and actions, not to multiply vague stories or disguise a preferred forecast."

