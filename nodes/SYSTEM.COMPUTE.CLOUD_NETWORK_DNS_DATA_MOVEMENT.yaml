id: "SYSTEM.COMPUTE.CLOUD_NETWORK_DNS_DATA_MOVEMENT"
name_en: "Cloud Network, DNS and Data Movement"
name_zh: "云网络、DNS 与数据移动"
domain: "SYSTEM"
module: "Compute Systems（计算系统）"
importance: "Core"
mastery_current: "L0"
mastery_candidate: "L1"

what: "Cloud network reachability is a chain of independent decisions that maps a service name to an address, advertises and selects a route to that address, accepts the connection, chooses a healthy target and transports request and response bytes across a valid return path."
why: "Healthy servers and durable data can be effectively nonexistent to users when DNS answers fail, prefixes are withdrawn, route or policy blocks a path, a load balancer has no eligible target, or the return path is broken; bandwidth alone cannot repair missing reachability."
mechanism: "Follow one client name and request through local and recursive DNS cache, authoritative records and TTL, public BGP and cloud route tables, firewall and gateway policy, TCP/TLS connection, load-balancer health and target selection, backend dependencies and the return path; measure each stage separately with latency, success, route, loss, throughput and boundary-byte evidence."
example: "During Meta's October 4, 2021 outage, a backbone maintenance command disconnected data centers; edge DNS sites withdrew BGP advertisements when they lost data-center connectivity, leaving operational DNS servers unreachable and preventing the Internet from finding services until backbone and routing were restored."
my_take: "I should never diagnose 'the network' as one component: I should name the client, record, address, route, selection decision, byte path and observation point, then test reachability before interpreting bandwidth or endpoint health."

