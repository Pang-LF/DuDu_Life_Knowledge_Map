id: "BUS.SEMICONDUCTOR.AI_WORKLOAD_VALUE_CHAIN_APPLICATION"
name_en: "AI Workload Value-chain Application"
name_zh: "人工智能工作负载价值链应用"
domain: "BUSINESS"
module: "Industry Atlas — Semiconductor + Compute"
importance: "Applied"
mastery_current: "L0"
mastery_candidate: "L1"

what: "AI workload value-chain application asks what a training buyer actually purchases: validated model progress produced by coordinated data, software, compute, memory, network, facilities and manufacturing capacity, including idle, spare, restart and qualification risk."
why: "GPU-hours, accelerator count and nameplate power can look precise while hiding who bears failed-step, straggler, repair, checkpoint, utilization, obsolescence and supply-assurance costs."
mechanism: "Fix the workload and useful-output boundary; map payers, beneficiaries, assets, contracts and control rights; distinguish resource usage from a bill; allocate each operating and supply risk to the party that controls or absorbs it; do not invent confidential price or supplier shares."
example: "Meta disclosed 30.84 million H100 GPU-hours for the Llama 3.1 405B model and a 54-day reliability snapshot with 419 unexpected interruptions, but public evidence does not reveal Meta's purchase price, total training bill or the dollar split among NVIDIA, networking, data-center, energy, packaging, memory, foundry and wafer suppliers."
my_take: "I should treat a frontier-training budget as payment for preserved learning progress and risk absorption, not multiply public GPU-hours by a list price and call the result total cost."

