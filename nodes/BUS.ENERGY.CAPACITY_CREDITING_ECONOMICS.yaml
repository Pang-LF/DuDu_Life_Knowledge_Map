id: "BUS.ENERGY.CAPACITY_CREDITING_ECONOMICS"
name_en: "Capacity Crediting Economics"
name_zh: "容量认证经济学"
domain: "BUSINESS"
module: "Industry Atlas（产业图谱）"
importance: "Core"
mastery_current: "L0"
mastery_candidate: "L1"

what: "Capacity crediting economics translates a resource's modeled reliability contribution into saleable UCAP quantity, capacity revenue, procurement cost, investment incentives, and disputes over model governance."
why: "A change in accreditation can materially change asset revenue and customer procurement needs even when the plant has not physically changed; treating credit and clearing price as the same variable hides who gains, who pays, and why."
mechanism: "Accredit nameplate MW into UCAP, offer eligible UCAP into a capacity auction or contract, clear quantity and price under regional constraints, allocate costs to load-serving entities and customers, impose performance duties, and revise model inputs and classifications as the portfolio and risk distribution change."
example: "At a purely hypothetical $100/MW-day, 100 MW accredited at 10%, 54%, and 95% would earn $365,000, $1.971 million, and $3.4675 million of annual gross capacity revenue respectively before unit adjustments, locational prices, costs, or other revenues."
my_take: "I should separate accredited quantity from auction price, then trace resource owner revenue, LSE obligation, customer cost, performance duty, portfolio complementarity, model uncertainty, transparency, and the reliability counterfactual."

