id: "META.SYSTEMS.INTEGRATION"
name_en: "Systems Thinking Integration"
name_zh: "系统思维整合"
domain: "META"
module: "Systems Thinking（系统思维）"
importance: "Core"
mastery_current: "L0"
mastery_candidate: "L2"

what: "Systems thinking integration begins with a whole-system outcome and follows one necessary unit through dependencies, propagation, returning effects, functional boundaries, the current constraint, and time delays."
why: "Separate concepts become useful only when they help diagnose an unfamiliar system and locate a lever that changes whole-system behavior rather than a local metric."
mechanism: "Define throughput and boundary, follow a concrete unit, identify necessary relationships, trace how changed conditions propagate and return, locate threshold behavior and the marginal constraint, then match interventions to causal delays and evidence."
example: "During the 2020-2022 automotive semiconductor shortage, a missing qualified microcontroller could prevent a nearly complete vehicle from becoming deliverable while depleted inventory, constrained wafer capacity, multi-tier ordering, and production delays amplified the effect."
my_take: "I should not start by labeling a case. I should start with the result the system must produce and let one necessary unit reveal which structures matter."

