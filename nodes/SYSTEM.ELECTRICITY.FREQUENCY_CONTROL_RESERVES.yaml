id: "SYSTEM.ELECTRICITY.FREQUENCY_CONTROL_RESERVES"
name_en: "Frequency Control and Reserves"
name_zh: "频率控制与备用"
domain: "SYSTEM"
module: "Energy Systems（能源系统）"
importance: "Core"
mastery_current: "L0"
mastery_candidate: "L1"

what: "Frequency control is a staged recovery process in which frequency containment reserves arrest a deviation, frequency restoration reserves return frequency and scheduled area exchanges to target, and replacement reserves restore the available restoration margin for another imbalance."
why: "A system can stop frequency from worsening yet remain off target, dependent on emergency resources, and unable to survive a second contingency; visible frequency recovery is therefore not equivalent to restored resilience."
mechanism: "Inertia first slows the initial change; FCR responds automatically to frequency, aFRR or mFRR correct frequency and area control error, and RR or redispatch releases the activated FRR while replenishing headroom, energy state, and operating margin."
example: "On 8 January 2021, Continental Europe split across a boundary that had carried about 5.8 GW. Automatic generation control, roughly 1.7 GW of contracted industrial load interruption, and up to about 595 MW of HVDC support arrested the north-west frequency decline before coordinated restoration and resynchronisation at 15:08."
my_take: "I should ask which resource contains, restores, or replaces; then verify direction, response time, full activation, duration, location, energy state, recovery time, and correlated failure rather than treating all reserve MW as interchangeable."

