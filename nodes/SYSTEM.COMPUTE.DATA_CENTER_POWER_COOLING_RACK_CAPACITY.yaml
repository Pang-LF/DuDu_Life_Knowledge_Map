id: "SYSTEM.COMPUTE.DATA_CENTER_POWER_COOLING_RACK_CAPACITY"
name_en: "Data Center Power, Cooling and Rack Capacity"
name_zh: "数据中心供电、冷却与机架容量"
domain: "SYSTEM"
module: "Compute Systems（计算系统）"
importance: "Core"
mastery_current: "L0"
mastery_candidate: "L1"

what: "Sustainable data-center compute capacity is the IT load that can simultaneously receive power through every electrical boundary, reject its heat through every thermal boundary, fit within local rack density and space limits, and preserve the chosen redundancy state."
why: "Campus utility megawatts, floor space, cooling-plant nameplate and installed servers are not interchangeable; a local busway, CDU, pipe, rack inlet, failure reserve or commissioning limit can prevent spare capacity elsewhere from becoming usable compute."
mechanism: "Follow one watt from utility service through switchgear, transformer, UPS or alternate source, PDU or busway, rack PSU and voltage regulators to the chip; then follow nearly the same watt as heat through cold plate or heat sink, technology loop, CDU, facility loop and heat rejection. At each boundary compare firm capacity after redundancy, losses, location, temperature, flow, transient response and measured utilization, then take the minimum aligned capacity rather than summing unrelated headroom."
example: "Frontier required a rebuilt data-center room, a 28 MW electrical room, warm-water direct liquid cooling and about 40 MW of planned cooling capacity. OLCF later reported peak PUE around 1.03, while current TOP500 data separately report benchmark-system power rather than total facility consumption."
my_take: "I should ask where the next rack's power and heat can travel under the required failure state, not whether the campus has spare megawatts in aggregate; PUE describes support-energy overhead, not useful compute, local density or deliverable capacity."

