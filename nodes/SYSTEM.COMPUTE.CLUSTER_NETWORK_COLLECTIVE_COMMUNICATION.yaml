id: "SYSTEM.COMPUTE.CLUSTER_NETWORK_COLLECTIVE_COMMUNICATION"
name_en: "Cluster Network, Topology and Collective Communication"
name_zh: "集群网络、拓扑与集合通信"
domain: "SYSTEM"
module: "Compute Systems（计算系统）"
importance: "Core"
mastery_current: "L0"
mastery_candidate: "L1"

what: "Collective communication coordinates a group of ranks to produce a shared result such as a reduction or gathered tensor; its completion depends on message semantics, algorithm rounds, per-node injection, physical topology and bisection, message-size overhead, the slowest participant and the communication that cannot overlap with useful work."
why: "Adding accelerators reduces local compute only if the shared gradient, activation or parameter movement does not become the new critical path; endpoint link peaks alone do not describe simultaneous group communication."
mechanism: "Name the collective and each rank's input and output; derive per-rank bytes and rounds for the selected ring, tree or hierarchical algorithm; map logical ranks onto intra-node links, NICs, racks and fabric cuts; measure small- and large-message latency, algorithm and bus bandwidth, contention and stragglers; then determine which communication is exposed rather than overlapped with independent compute."
example: "Horovod replaced TensorFlow parameter-server aggregation with ring-allreduce and Tensor Fusion. Its paper reported 88% scaling efficiency for Inception V3 and ResNet-101, only a further 3-4% improvement from RDMA for those models, but about 30% for the more communication-bound VGG-16."
my_take: "I should reconstruct the collective result and data movement before discussing network speed, and distinguish endpoint injection, shared topology cuts, message startup, rank readiness and overlap with evidence from the actual job."

