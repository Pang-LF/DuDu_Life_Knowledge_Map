id: "BUS.SEMICONDUCTOR.DATA_CENTER_INFRASTRUCTURE_ECONOMICS"
name_en: "Data Center Infrastructure Economics"
name_zh: "数据中心基础设施经济学"
domain: "BUSINESS"
module: "Industry Atlas（产业图谱）"
importance: "Core"
mastery_current: "L0"
mastery_candidate: "L1"

what: "Data-center infrastructure economics allocates capital, energy, reliability reserve and stranded capacity across utility interconnection, substations, transformers, switchgear, UPS or generators, busways, racks, cooling plants, CDUs, controls, buildings and compute customers."
why: "A provider can own large nameplate MW yet sell fewer usable IT kW because electrical, thermal, spatial and redundancy limits are misaligned; maximizing utilization can also consume the reserve that protects service during faults or maintenance."
mechanism: "Identify what the operator actually commits—space, critical IT power, density, cooling conditions, availability or compute service—then trace who finances and operates each electrical and thermal layer. Compare commissioned firm IT kW, rack-level deliverability, failure-state headroom, PUE and utilization with lifecycle capital, energy, water, maintenance, commissioning, migration and outage exposure; keep confidential price, discount, margin and remedy terms separate from public engineering capability."
example: "OLCF converted Titan's former room for Frontier by rebuilding electrical, cooling and structural infrastructure rather than merely installing cabinets; the project included a new 28 MW electrical room, warm-water cooling plant and roughly 40 MW of planned cooling capacity."
my_take: "I should value data-center capacity by commissioned, locally deliverable IT kW under a named reliability state and by cost per useful compute output, while treating unused reserve and accidental stranded capacity as different economic objects."

