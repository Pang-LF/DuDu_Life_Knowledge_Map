id: "SYSTEM.SEMICONDUCTOR.CHIP_FABRICATION_FOUNDATION"
name_en: "Chip Fabrication Foundation"
name_zh: "芯片制造基础"
domain: "SYSTEM"
module: "Compute Systems（计算系统）"
importance: "Core"
mastery_current: "L0"
mastery_candidate: "L1"

what: "Chip fabrication repeatedly creates temporary pattern boundaries and uses them to control where films are added, materials are removed, electrical properties are modified, surfaces are flattened and results are measured, accumulating many aligned layers into devices and interconnects."
why: "A circuit layout, mask, exposed resist, processed wafer, die and good die are different objects; treating fabrication as one printing step hides process integration, overlay, defect, yield and cycle-time constraints."
mechanism: "Form or deposit a film; coat, align, expose and develop photoresist; transfer the temporary pattern through etch, implantation or selective material formation; strip, anneal, planarize, clean and measure; then repeat within a shared coordinate system and process window."
example: "Jean Hoerni's 1959 planar process retained silicon dioxide over sensitive junctions while opening controlled windows for diffusion and contacts, improving surface stability and enabling repeated same-side processing that became foundational to monolithic integrated circuits."
my_take: "I should reconstruct a fabricated feature by asking which temporary mask selected its position, which operation made the permanent change, how the result was measured and how its output constrained the next layer."

