id: "META.CAUSAL.CONFOUNDER"
name_en: "Confounder"
name_zh: "混杂因素"
domain: "META"
module: "Causal Reasoning（因果推理）"
importance: "Core"
mastery_current: "L0"
mastery_candidate: "L2"

what: "A confounder is a pre-treatment common cause that influences both treatment selection and outcome risk, making treated and untreated groups incomparable before treatment occurs."
why: "Without identifying why people enter different groups, an observed outcome difference can be mistaken for an intervention effect even after temporal order and reverse causality have been addressed."
mechanism: "State treatment and outcome, identify variables that existed before treatment, ask which changed both assignment probability and outcome risk, then improve comparability through design or justified adjustment while preserving mediators and acknowledging unmeasured or mismeasured common causes."
example: "Observational studies associated menopausal hormone use with lower coronary risk, while the randomized WHI trial of a specific estrogen-plus-progestin regimen did not support cardiac prevention. Treatment selection and baseline health were important confounding candidates, although regimen, age, timing, and adherence also limited direct comparability."
my_take: "Before interpreting a group difference as treatment effect, I should ask who entered each group, why, and whether those reasons already predicted the outcome."

