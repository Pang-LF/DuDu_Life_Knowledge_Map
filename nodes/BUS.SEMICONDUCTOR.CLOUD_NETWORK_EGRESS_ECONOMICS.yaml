id: "BUS.SEMICONDUCTOR.CLOUD_NETWORK_EGRESS_ECONOMICS"
name_en: "Cloud Network and Egress Economics"
name_zh: "云网络与出站传输经济学"
domain: "BUSINESS"
module: "Industry Atlas — Semiconductor + Compute"
importance: "Applied"
mastery_current: "L0"
mastery_candidate: "L1"

what: "Cloud network economics packages managed naming, route and gateway control, load-balancing decisions, connection and byte processing, private interconnection, cross-zone or cross-region movement, internet egress, observability and resilience into separately metered service boundaries."
why: "Two architectures with the same stored bytes and compute can have different performance, availability and cost because each request crosses different zones, gateways, load balancers, caches, regions and internet boundaries; the lowest per-GB rate can also sacrifice failure isolation or increase latency."
mechanism: "Trace who controls and pays for DNS queries, load-balancer hours and capacity units, NAT or transit processing, cross-zone and cross-region bytes, CDN delivery, private links and internet egress; compare cost per successful useful request under normal and failed paths while separating public list price from provider cost, private discounts, margin and switching-cost hypotheses."
example: "AWS public pricing currently meters Application Load Balancers by the highest hourly LCU dimension among new connections, active connections, processed bytes and rule evaluations, while EC2 data-transfer pages distinguish internet ingress, internet egress and same-Region cross-AZ movement."
my_take: "I should draw every network boundary crossed by one useful request, identify whether the bill follows connections, processed bytes, direction or location, and test whether a cheaper path still meets latency and failure-domain requirements."

