id: "META.PROBABILITY.CONDITIONAL"
name_en: "Conditional Probability"
name_zh: "条件概率"
domain: "META"
module: "Probability & Bayesian Thinking（概率与贝叶斯思维）"
importance: "Core"
mastery_current: "L0"
mastery_candidate: "L2"

what: "Conditional probability is the probability of a target event recalculated within the subpopulation selected by a stated condition. P(A|B) and P(B|A) usually differ because they use different denominators."
why: "Aggregated rates mix subgroup probabilities with subgroup composition. Without naming the condition and denominator, evidence can be reversed, subgroup patterns can be hidden, and descriptive probabilities can be mistaken for causal effects."
mechanism: "Define target event A and condition B; retain only units satisfying B; count A within that subset; write the denominator explicitly; when reversing or adding a condition, rebuild the denominator; use the data-generating process to decide which conditioning set answers the question."
example: "Among all 1973 UC Berkeley graduate applications, 44.3% of male and 34.6% of female applicants were admitted. Within the six largest departments, women applied far more heavily to low-admission departments, so department-conditioned rates did not reproduce the aggregate disadvantage."
my_take: "Before interpreting a percentage, I should complete the sentence 'among units satisfying which condition?' and avoid reversing the condition without rebuilding the denominator."

