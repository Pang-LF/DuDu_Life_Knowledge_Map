id: "BUS.SEMICONDUCTOR.CLOUD_TCO_BUILD_BUY_ECONOMICS"
name_en: "Cloud TCO and Build-versus-Buy Economics"
name_zh: "云总成本与自建购买经济学"
domain: "BUSINESS"
module: "Industry Atlas — Semiconductor + Compute"
importance: "Applied"
mastery_current: "L0"
mastery_candidate: "L1"

what: "Cloud build-versus-buy economics traces how providers convert data-center, server, chip, storage, network, software and labor capital into metered services, and compares those payments with the full fixed, variable, operating, migration and residual-risk cost of owning the same useful capability."
why: "Public list prices expose only part of the economic object: providers pool idle and demand risk across customers, customers retain application and business risk, and moving a workload can replace third-party expense with depreciation, facilities, support, supply-chain and engineering cost rather than eliminating it."
mechanism: "Map physical capability downstream and money upstream; separate provider cost, customer price and supplier margin; normalize by successful useful output; model utilization and demand uncertainty; include commitments, reservations, requests, data movement, people, reliability, capital timing and exit; then record the ranges and facts that would reverse the sourcing decision."
example: "Dropbox moved more than 90% of user data to Magic Pocket after growing from about 40 PB in 2012 to more than 500 PB in 2016, while retaining a hybrid relationship with AWS for workloads and geographies where buying continued to make sense."
my_take: "I should ask which party can operate a named layer at lower complete cost and risk under the actual workload, rather than assuming ownership or outsourcing is inherently efficient."

