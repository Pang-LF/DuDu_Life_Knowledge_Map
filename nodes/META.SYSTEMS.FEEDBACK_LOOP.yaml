id: "META.SYSTEMS.FEEDBACK_LOOP"
name_en: "Feedback Loop"
name_zh: "反馈回路"
domain: "META"
module: "Systems Thinking（系统思维）"
importance: "Core"
mastery_current: "L0"
mastery_candidate: "L2"

what: "A feedback loop exists when a system's output or consequence returns through a causal path and changes the variable or process that produced it."
why: "A one-way chain explains propagation once; feedback explains why a change can sustain, amplify, or regulate itself across repeated rounds."
mechanism: "In reinforcing feedback, the returned effect pushes change in the same direction. In balancing feedback, the returned effect opposes deviation from a goal, limit, or reference state."
example: "At Silicon Valley Bank in March 2023, rising depositor concern prompted withdrawals, withdrawals reduced liquidity and exposed distress, and visible distress increased depositor concern."
my_take: "To find feedback, trace an effect all the way back to its starting variable and identify the speed, sign, and break points of the return path."

