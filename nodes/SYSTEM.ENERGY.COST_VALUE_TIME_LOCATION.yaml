id: "SYSTEM.ENERGY.COST_VALUE_TIME_LOCATION"
name_en: "Energy Cost, Value, Time and Location"
name_zh: "能源成本、价值、时间与地点"
domain: "SYSTEM"
module: "Energy Systems（能源系统）"
importance: "Core"
mastery_current: "L0"
mastery_candidate: "L1"

what: "A resource's system value is the marginal change it causes relative to a specified no-resource counterfactual, conditional on when and where it is deliverable and on the portfolio already present."
why: "Electricity demand, network constraints, reliability risk and renewable output vary by hour and node, so equal MWh can avoid very different costs or provide no incremental service at all."
mechanism: "Use chronological and locational system states to identify the marginal resource displaced, accepted output, scarcity contribution, flexibility, congestion relief, emissions effect and portfolio interaction; recalculate as penetration and the surrounding portfolio change."
example: "CAISO can curtail solar during low-net-load spring afternoons yet require rapid evening replacement as solar falls. Storage, transmission and flexible demand can raise the value of midday output by moving or absorbing it, but each brings its own cost and constraints."
my_take: "Value is not a permanent sticker on a technology; it is a marginal relationship between one resource and a changing system."

