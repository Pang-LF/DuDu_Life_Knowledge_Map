id: "BUS.ENERGY.PHYSICAL_ASSET_REQUIREMENTS"
name_en: "Physical Asset Requirements"
name_zh: "物理资产需求"
domain: "BUSINESS"
module: "Industry Atlas（产业图谱）"
importance: "Core"
mastery_current: "L0"
mastery_candidate: "L1"

what: "Physical asset requirements translate a target energy service into the production, storage, transport, network, thermal-management, redundancy, and end-use assets needed to deliver a specified amount and rate at a required place and time."
why: "A low energy price or high device efficiency can still produce an expensive service when low density, high peak power, low utilization, safety requirements, or network constraints force the system to buy more assets."
mechanism: "Define usable energy, peak and continuous power, duration, location, reliability, and utilization; convert laboratory metrics to system-level performance; size storage, conversion, network, cooling, and backup assets; then trace who finances each asset and how costs are recovered."
example: "X-57's battery was not only a cell purchase: its mass and power requirements changed seating, airframe, wing, motors, controls, cooling, testing, airport charging implications, and certification work."
my_take: "I should evaluate the complete asset stack required by a service, not infer system economics from fuel price, cell cost, or device efficiency alone."

