id: "BUS.ENERGY.CAPACITY_ADEQUACY_ECONOMICS"
name_en: "Capacity and Adequacy Economics"
name_zh: "容量与充裕度经济学"
domain: "BUSINESS"
module: "Industry Atlas（产业图谱）"
importance: "Core"
mastery_current: "L0"
mastery_candidate: "L1"

what: "Capacity and adequacy economics allocates the cost and performance obligation of keeping accredited capability available for future scarcity, separately from payment for the MWh actually generated."
why: "Resources needed for rare stress hours may not recover fixed costs from ordinary energy sales, while under-procurement by one load-serving entity can impose outage risk on all users."
mechanism: "Regulators or system rules assign obligations to load-serving entities; LSEs self-supply or contract bilaterally with qualified resources; supply plans create must-offer and availability obligations; customer-funded capacity payments support fixed cost while penalties, substitution, testing, and accreditation limit paper-only commitments."
example: "California's framework requires system, local, and flexible RA procurement. The 2020 event exposed that credits with limited CAISO visibility and a peak-focused counting framework could satisfy a paper obligation without fully representing evening deliverability."
my_take: "I should trace customer-to-LSE-to-provider money separately from CAISO operational control, then test accreditation, duration, location, availability, opportunity cost, penalties, market power, and the no-contract reliability counterfactual."

