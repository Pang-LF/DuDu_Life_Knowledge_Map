id: "SYSTEM.COMPUTE.ACCELERATOR_GPU_PARALLELISM"
name_en: "GPU Parallelism and Useful Throughput"
name_zh: "GPU并行计算与有效吞吐"
domain: "SYSTEM"
module: "Compute Systems（计算系统）"
importance: "Core"
mastery_current: "L0"
mastery_candidate: "L1"

what: "A GPU converts many similar, relatively independent operations into throughput by organizing threads into hardware-scheduled warps across streaming multiprocessors, while useful performance depends on ready work, control alignment, memory access and synchronization rather than arithmetic-unit count alone."
why: "Peak FLOPS and memory bandwidth are ceilings; a workload reaches them only when software exposes enough parallel work, supplies useful data, avoids destructive divergence and amortizes communication and coordination."
mechanism: "Kernels launch grids of thread blocks; hardware groups threads into 32-thread warps; SM schedulers issue ready warps while others wait; occupancy supplies alternatives for latency hiding; warp-internal branch divergence disables lanes on each path; coalesced accesses reduce memory transactions; barriers, dependencies and cross-device communication reduce independent progress."
example: "AlexNet trained a roughly 60-million-parameter convolutional network on about 1.2 million images using two 3 GB GTX 580 GPUs, optimized convolution, selective cross-GPU communication and CPU-GPU pipeline overlap, completing roughly 90 dataset passes in five to six days."
my_take: "I should treat GPU cores as potential throughput, then inspect workload parallelism, warp readiness, divergence, address transactions, resource occupancy, synchronization and communication before using theoretical FLOPS to predict application speed."

