id: "BUS.ENERGY.CAPACITY_MARKET_MISSING_MONEY"
name_en: "Capacity Market and Missing Money"
name_zh: "容量市场与缺失收入"
domain: "BUSINESS"
module: "Industry Atlas（产业图谱）"
importance: "Core"
mastery_current: "L0"
mastery_candidate: "L1"

what: "Missing money is the positive annual gap between the net cost required to enter or retain the marginal dependable capacity needed for a chosen reliability target and that resource's expected net energy and ancillary-service margins."
why: "Insurance-like resources may earn revenue in very few, uncertain scarcity hours. Price caps, out-of-market reliability actions, weak demand response, policy-selected reserve margins, short procurement horizons, and financing risk can leave the dependable portfolio underfunded even when average energy prices look adequate."
mechanism: "Estimate annualized entry or avoidable going-forward cost; subtract expected net energy and ancillary-service margins; compare the residual with the capacity product's accredited MW, clearing price, contract term, performance duty, penalties, price cap, and alternatives; then allocate demand, price, construction, performance, policy, and stranded-cost risk among load, LSEs, providers, and investors."
example: "PJM's RTO capacity price rose from $28.92/MW-day for 2024/25 to $269.92 for 2025/26 and then to the $329.17 cap for 2026/27. Yet the 2027/28 auction procured 145,777.1 MW UCAP including FRR, 6,517 MW below the reliability requirement, showing that a high one-year signal cannot instantly reverse multi-year construction, equipment, permitting, and contracting delays."
my_take: "I should treat capacity payments, scarcity rents, bilateral obligations, and long-term contracts as different allocations of the same reliability cost and risk, then ask what product, duration, performance obligation, and counterfactual each payment buys."

