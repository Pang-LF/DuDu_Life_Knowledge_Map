id: "BUS.ENERGY.TWO_SETTLEMENT_MARKET_RISK"
name_en: "Two-Settlement Market Risk"
name_zh: "双结算市场风险"
domain: "BUSINESS"
module: "Industry Atlas（产业图谱）"
importance: "Core"
mastery_current: "L0"
mastery_candidate: "L1"

what: "Two-settlement market risk is the cash-flow and credit exposure created when actual load or generation differs from a day-ahead position and the deviation is settled at a potentially extreme real-time locational price."
why: "Similar annual day-ahead and real-time average prices can hide severe participant-level losses concentrated in a few intervals, locations, quantities, or failed physical hedges."
mechanism: "Participants combine day-ahead purchases or sales, bilateral contracts, owned assets, demand response, and financial hedges; residual volume, price spread, location basis, performance, collateral, and counterparty default determine who bears the realized loss."
example: "During Winter Storm Uri, ERCOT's 2021 market monitor reported more than 52 GW unavailable at the event peak, real-time prices above $1,000/MWh for 166 hours, annual average real-time price of $167.88/MWh versus $40.73 excluding Uri, and short payments exceeding $3 billion."
my_take: "I should never infer safety from average DAM and RTM prices; I need the participant's interval-level volume, basis, contract performance, collateral calls, and default waterfall."

