id: "SYSTEM.COMPUTE.CLOUD_STORAGE_DURABILITY_REPLICATION_CONSISTENCY"
name_en: "Cloud Storage Durability, Replication and Consistency"
name_zh: "云存储持久性、复制与一致性"
domain: "SYSTEM"
module: "Compute Systems（计算系统）"
importance: "Core"
mastery_current: "L0"
mastery_candidate: "L1"

what: "Cloud storage reliability is an explicit contract linking what a successful write acknowledgement means, which device and location failures the encoded copies survive, which version a later read must return, how latent corruption is detected and repaired, and how far an asynchronous recovery copy may lag."
why: "Durability, availability, consistency and disaster-recovery RPO answer different questions: bytes can remain intact while requests fail, a highly available read can be stale, and a strongly consistent source Region can still have an asynchronous destination that is behind."
mechanism: "Follow one object through identity and integrity checks, placement, persistence, acknowledgement, metadata lookup, version selection, checksum scrubbing, repair, version retention and cross-region replication; test each stage against its failure domain, observable metric, time boundary and recovery procedure."
example: "Amazon S3 changed from eventual visibility for some operations to strong read-after-write consistency for GET, PUT and LIST in December 2020, removing the need for consistency side systems such as EMRFS Consistent View and S3Guard while leaving versioning, replication lag and disaster recovery as separate concerns."
my_take: "I should ask what exact state a successful PUT proves, which reads must observe it, what corruption and deletion paths remain, and whether object-level replication status and a real recovery test support the claimed RPO instead of treating replica count or eleven nines as a universal safety guarantee."

