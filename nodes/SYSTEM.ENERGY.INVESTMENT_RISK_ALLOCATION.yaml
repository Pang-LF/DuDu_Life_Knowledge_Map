id: "SYSTEM.ENERGY.INVESTMENT_RISK_ALLOCATION"
name_en: "Energy Investment Risk Allocation"
name_zh: "能源投资风险分配"
domain: "SYSTEM"
module: "Energy Systems（能源系统）"
importance: "Core"
mastery_current: "L0"
mastery_candidate: "L1"

what: "Energy investment risk allocation assigns market-price, quantity, construction, performance, input-cost, counterparty, policy, and stranded-asset states among developers, lenders, shareholders, utilities, governments, and customers through ownership, contracts, regulation, and financing priority."
why: "The same physical asset can require different customer payments and support different financing depending on who controls each risk, who can diversify it, who absorbs first loss, and whether contract duration matches construction and debt repayment."
mechanism: "Start with an uncontracted project cash-flow distribution; identify each actor's control and loss-bearing capacity; assign risks through PPA, CfD, tolling, capacity, guarantee, or regulated-asset clauses; preserve incentives for controllable performance; stress delays and correlated downside states; and compare total customer and investor outcomes against explicit alternatives."
example: "The Hinkley Point C CfD transferred much of post-operation wholesale-price risk to electricity customers while leaving principal construction overrun and delay exposure with investors. Observed schedule and financing changes show that reducing market risk did not remove construction or funding risk."
my_take: "I should evaluate risk placement by control, diversification, tail-loss capacity, incentive effects, and counterfactual cost, not by whether the arrangement is labeled public, private, market, or regulated."

