id: "BUS.MEDIA.DTC.CUSTOMER_RELATIONSHIP"
name_en: "DTC Customer Relationship"
name_zh: "DTC 客户关系"
domain: "BUSINESS"
module: "Subscription Video / Pay-TV / Streaming（订阅视频 / 付费电视 / 流媒体）"
importance: "Core"
mastery_current: "L0"
mastery_candidate: "L1"

what: "A DTC streaming service moves more pricing, account, billing, product, usage-data, service, retention, and cancellation capabilities from a traditional distributor toward the programmer, but the relationship can still be split with app stores, device platforms, and wholesale partners."
why: "Saying that a company 'owns the customer' hides which operational rights and responsibilities it actually controls and whether the relationship produces profitable economics."
mechanism: "Direct signup gives the programmer recurring payment and first-party product interaction while making it responsible for acquisition, technology, content, payment, service, and churn. Platform billing or wholesale entitlements divide acquisition, billing, identity, data, and revenue by contract."
example: "Disney+ launched in 2019 with direct web subscriptions as well as Apple, Amazon, Google, Roku, and Verizon paths; Disney therefore operated the product for all users while the billing and acquisition relationship varied by channel."
my_take: "To identify who owns a customer relationship, I should trace acquisition, identity, billing, usage data, service, cancellation, and winback separately instead of inferring ownership from the app brand."

