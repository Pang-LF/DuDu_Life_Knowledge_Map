id: "BUS.MEDIA.CORD_CUTTING.SYSTEM_EFFECT"
name_en: "Cord Cutting System Effect"
name_zh: "剪线退订的系统影响"
domain: "BUSINESS"
module: "Subscription Video / Pay-TV / Streaming（订阅视频 / 付费电视 / 流媒体）"
importance: "Core"
mastery_current: "L0"
mastery_candidate: "L1"

what: "Cord cutting is a household's cancellation of a traditional multichannel Pay-TV subscription, removing a recurring payer from the legacy distribution system rather than ending video consumption."
why: "One cancellation changes more than distributor revenue: it reduces the affiliate-fee and advertising reach base, weakens shared cost funding and bargaining scale, and forces distributors, programmers, and rights holders to redesign products and customer relationships."
mechanism: "The distributor loses video revenue while avoiding some per-subscriber costs; programmers lose receiving-subscriber fees and linear reach while multi-year content commitments adjust more slowly; higher rates, thinner packages, or lower value can alter the remaining households' incentive to stay."
example: "The FCC reported that traditional U.S. MVPD subscriptions fell from a 2012 peak of 101.6 million to 54.1 million at the end of 2023, while Disney reported that a 7% positive ESPN rate effect in fiscal 2025 was almost offset by a 7% negative subscriber effect."
my_take: "Cord cutting is a withdrawal from a recurring funding and distribution relationship; to understand it, I should trace the missing payment through every actor rather than equate it with less viewing."

