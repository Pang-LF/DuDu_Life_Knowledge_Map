id: "BUS.ENERGY.CONVERSION_ASSETS"
name_en: "Conversion Assets"
name_zh: "能源转换资产"
domain: "BUSINESS"
module: "Industry Atlas（产业图谱）"
importance: "Core"
mastery_current: "L0"
mastery_candidate: "L1"

what: "Conversion assets transform energy from one form into a carrier or service, including turbines, boilers, generators, inverters, motors, electrolyzers, heat pumps, and heat-recovery systems."
why: "Higher efficiency often requires more capital, equipment, integration, and maintenance in exchange for lower fuel or electricity consumption over future operating hours."
mechanism: "Compare heat rate or input intensity, capital cost, fixed and variable maintenance, start time, ramp rate, availability, capacity factor, fuel price, asset life, and output value; then calculate whether cumulative variable-cost savings repay the incremental fixed asset."
example: "Nishi-Nagoya added heat-recovery steam generators and a steam cycle behind its gas turbines. The extra assets recovered exhaust heat and reduced fuel per MWh, while simple-cycle turbines remain valuable where fast response and few annual operating hours matter more than fuel efficiency."
my_take: "I should treat efficiency investment as a capital-for-fuel trade-off whose value is amplified by utilization, not assume the highest design-point efficiency is always the best asset."

