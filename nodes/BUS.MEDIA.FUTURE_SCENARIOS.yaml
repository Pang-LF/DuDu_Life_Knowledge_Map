id: "BUS.MEDIA.FUTURE_SCENARIOS"
name_en: "Streaming Future Scenarios"
name_zh: "流媒体未来情景"
domain: "BUSINESS"
module: "Subscription Video / Pay-TV / Streaming（订阅视频 / 付费电视 / 流媒体）"
importance: "Core"
mastery_current: "L0"
mastery_candidate: "L1"

what: "Streaming future scenarios organize structural uncertainty around content differentiation and aggregator-created incremental value into distinct worlds with measurable signals and conditional strategic options."
why: "Bundle announcements, subscriber totals and platform scale can support incompatible futures. A scenario set prevents one visible trend from becoming an unexamined industry forecast."
mechanism: "Fix a two-year decision horizon; preserve long contracts, installed device relationships and existing DTC capabilities as predetermined elements; branch on content differentiation and aggregation value; derive customer ownership, economics and bargaining power in each world; monitor direct-versus-partner cohort conversion, retention, contribution and control rights; update investments conditionally."
example: "Four 2026-2028 worlds distinguish Fortress Services, New Cable, Utility Shelf and Rotation Market. Comcast StreamSaver, split NBA rights and Roku's OS reach are evidence inputs, but none alone proves which world will dominate."
my_take: "I should evaluate bundles through incremental cohort economics and control rights, while preserving options for direct, wholesale, advertising and win-back models until diagnostic signals strengthen."

