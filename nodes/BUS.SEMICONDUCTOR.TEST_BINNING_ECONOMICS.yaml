id: "BUS.SEMICONDUCTOR.TEST_BINNING_ECONOMICS"
name_en: "Semiconductor Test and Binning Economics"
name_zh: "半导体测试与分档经济学"
domain: "BUSINESS"
module: "Industry Atlas（产业图谱）"
importance: "Core"
mastery_current: "L0"
mastery_candidate: "L1"

what: "Test and binning economics choose where and how deeply to test semiconductor die by balancing tester time, parallelism, engineering development, false rejects and bin recovery against package scrap, warranty, field failure and customer risk from escapes."
why: "A physically fabricated die does not become commercial output until test accepts and grades it; the same test decision can destroy a usable die, preserve package value, recover a lower sellable bin or transfer hidden risk downstream."
mechanism: "Fabless product teams define specifications, DFT and test programs; foundries, IDMs or OSATs run probe, handlers and final test using ATE and contact hardware; contracts and yield attribution allocate test charges, retest, scrap, quality guarantees and remedies; field and downstream data update guardbands and test insertions over the product lifecycle."
example: "NVIDIA's initial USD 196 million charge for notebook MCP and GPU field failures equaled roughly 22% of that quarter's USD 892.7 million revenue, and cumulative net charges reached USD 475.9 million by January 2012, illustrating how a late escape can bind repair, replacement, litigation and customer costs far beyond bare-die value."
my_take: "I should compare the marginal cost and information gained at each test insertion with the expected value at risk downstream, while separating manufacturing yield from test yield, false rejects, escapes, retest and performance-bin mix."

