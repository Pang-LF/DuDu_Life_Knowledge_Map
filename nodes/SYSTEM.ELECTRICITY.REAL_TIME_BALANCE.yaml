id: "SYSTEM.ELECTRICITY.REAL_TIME_BALANCE"
name_en: "Real-Time Balance"
name_zh: "实时平衡"
domain: "SYSTEM"
module: "Energy Systems（能源系统）"
importance: "Core"
mastery_current: "L0"
mastery_candidate: "L1"

what: "Real-time balance is the continuous matching of active-power injections with demand, exports, charging, and network losses inside a synchronous electricity system; a sustained mismatch appears as frequency movement."
why: "Annual energy and installed capacity can be sufficient while a sudden second-scale power deficit still destabilizes the grid; reliability depends on response speed, duration, location, network reach, and recovery margin."
mechanism: "When electrical load exceeds mechanical or inverter-supplied input, stored rotational energy and frequency-sensitive demand initially cover part of the deficit, so frequency falls; automatic frequency response, operating reserves, redispatch, storage, and ultimately load shedding act on successive timescales to arrest and restore balance."
example: "On 9 August 2019, generation losses totaling about 2,100 MW exceeded roughly 1,000 MW of held response in Great Britain; frequency fell from 50 Hz to 48.8 Hz and automatic low-frequency demand disconnection affected more than one million consumers."
my_take: "For any electricity shortage claim, I should separate MW from MWh and ask how fast the imbalance appeared, which stored energy acted first, what response followed, how long it lasted, where it was located, and how reserves were rebuilt."

