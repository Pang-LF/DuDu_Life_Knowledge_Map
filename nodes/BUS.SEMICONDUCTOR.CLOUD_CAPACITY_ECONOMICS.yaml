id: "BUS.SEMICONDUCTOR.CLOUD_CAPACITY_ECONOMICS"
name_en: "Cloud Capacity Economics"
name_zh: "云容量经济学"
domain: "BUSINESS"
module: "Industry Atlas（产业图谱）"
importance: "Core"
mastery_current: "L0"
mastery_candidate: "L1"

what: "Cloud capacity economics allocates capital, idle capacity, fragmentation, demand variability, performance contention and availability risk among cloud providers, infrastructure suppliers and customers through on-demand usage, commitments, reservations, interruptible capacity and managed services."
why: "A provider can own idle fleet resources yet lack a feasible placement for a specific instance, while a customer can possess quota without assured hardware or pay for a capacity reservation that remains intentionally unused."
mechanism: "Trace physical and software capital from data-center, server, chip and network suppliers into a provider resource pool; map customer payments to usage, discount commitments and physical capacity promises; then compare placement success, pending time, resource fragmentation, reserved-versus-used capacity, tail contention, reliability headroom and cost per useful output without conflating high utilization with service quality."
example: "AWS documents distinguish account quota failures from current On-Demand capacity shortages and bill an On-Demand Capacity Reservation at the equivalent On-Demand rate whether occupied or unused, explicitly transferring some idle-capacity cost to the customer seeking location-specific assurance."
my_take: "I should identify the exact capacity promise and risk owner before comparing hourly prices: ordinary on-demand service, discount commitment and location-specific reservation are different economic objects."

