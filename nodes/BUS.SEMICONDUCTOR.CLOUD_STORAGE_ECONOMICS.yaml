id: "BUS.SEMICONDUCTOR.CLOUD_STORAGE_ECONOMICS"
name_en: "Cloud Storage Economics"
name_zh: "云存储经济学"
domain: "BUSINESS"
module: "Industry Atlas — Semiconductor + Compute"
importance: "Applied"
mastery_current: "L0"
mastery_candidate: "L1"

what: "Cloud storage economics packages source and redundant capacity, request processing, access latency, retrieval, version retention, replication, inter-region transfer, integrity operations and recovery capability into storage classes and separately metered features."
why: "The lowest price per stored gigabyte can be a poor comparison when an application requires multi-AZ protection, frequent requests, fast retrieval, retained versions, low replication lag or tested regional recovery, because each requirement changes both provider resources and customer lifecycle cost."
mechanism: "Trace who pays for source and destination bytes, PUT and GET requests, minimum storage duration, minimum billable object size, retrieval, early deletion, cross-zone or cross-region transfer, monitoring and replication time control; compare cost per recoverable object under a named failure, RPO, RTO and access pattern rather than storage price alone."
example: "AWS documents that S3 cross-region replication customers pay for destination storage, replication PUT requests and applicable inter-region transfer, while versioning stores each version as a full object and infrequent-access or archive classes add different minimum-duration and retrieval conditions."
my_take: "I should identify which reliability and access promises are included in the base storage class, which are separately purchased, and whether lifecycle, version and egress costs make the complete recoverable-data design more expensive than its headline per-GB rate suggests."

