id: "META.BAYESIAN.UPDATING"
name_en: "Bayesian Updating"
name_zh: "贝叶斯更新"
domain: "META"
module: "Probability & Bayesian Thinking（概率与贝叶斯思维）"
importance: "Core"
mastery_current: "L0"
mastery_candidate: "L2"

what: "Bayesian updating starts from a prior probability and reallocates probability after evidence according to how likely that evidence was under competing hypotheses. Evidence that discriminates more strongly between hypotheses produces a larger update."
why: "New information should neither erase previous evidence nor be ignored. A disciplined update combines the starting prevalence with the evidence's true-detection and false-alarm behavior, preventing vivid signals, search failures or repeated correlated alerts from being overinterpreted."
mechanism: "State mutually competing hypotheses and their priors; estimate the likelihood of the observed evidence under each; multiply prior odds by the likelihood ratio; normalize to obtain posterior probabilities; test sensitivity to model assumptions and evidence dependence; treat the posterior as the prior for the next genuinely new observation."
example: "In the AF447 search, each seabed cell's prior probability was reduced according to the probability that previous search equipment would have detected wreckage there. A failed high-detection-probability search reduced a cell more than a failed low-detection-probability search, without making either probability automatically zero."
my_take: "When evidence arrives, I should ask how often I would see it under each competing explanation, update from the recorded starting probability, and expose assumptions about detection, false alarms and dependence."

