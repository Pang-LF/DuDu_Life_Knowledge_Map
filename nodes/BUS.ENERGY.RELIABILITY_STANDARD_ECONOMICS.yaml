id: "BUS.ENERGY.RELIABILITY_STANDARD_ECONOMICS"
name_en: "Reliability Standard Economics"
name_zh: "可靠性标准经济学"
domain: "BUSINESS"
module: "Industry Atlas（产业图谱）"
importance: "Core"
mastery_current: "L0"
mastery_candidate: "L1"

what: "Reliability standard economics chooses how much system adequacy customers should collectively fund by comparing the marginal cost of dependable capacity with the probability-weighted customer cost of unserved energy."
why: "Zero modeled shortage risk is not free, while under-procurement shifts outage risk onto customers who cannot individually contract around a shared grid. The chosen metric, Value of Lost Load, Cost of New Entry, and allocation rule determine both procurement volume and who bears cost and risk."
mechanism: "Estimate customer Value of Lost Load, the annualized net Cost of New Entry for marginal dependable capacity, and the reliability distribution; set a standard near the point where another MW costs as much as the expected outage harm it avoids; translate the standard into a capacity target; procure de-rated capacity; charge load; and impose availability and performance obligations."
example: "Great Britain's central 2013 assumptions implied 2.78 hours LOLE and policy adopted 3 hours. The first 2014 T-4 auction procured 49.3 GW of de-rated capacity at GBP 19.40/kW-year, implying about GBP 956 million per delivery year in simple gross agreement value before adjustments."
my_take: "I should separate the reliability target, capacity quantity, auction price, gross customer-funded payment, performance duty, expected risk reduction, and distribution of outage harm instead of treating 'more reliability' as an unpriced engineering good."

