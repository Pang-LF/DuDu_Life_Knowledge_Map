id: "BUS.SEMICONDUCTOR.YIELD_LEARNING_ECONOMICS"
name_en: "Yield Learning Economics"
name_zh: "良率学习经济学"
domain: "BUSINESS"
module: "Industry Atlas（产业图谱）"
importance: "Core"
mastery_current: "L0"
mastery_candidate: "L1"

what: "Yield-learning economics allocates the capital, engineering wafers, scrap, delay, product-window, test, data and contract risks required to move a process from qualification toward predictable good-die output among foundries or IDMs, fabless customers and equipment-material suppliers."
why: "A node can be technically available yet economically immature; the parties that fund early learning, control cross-lot evidence and retain reusable improvements can have different costs, benefits and bargaining power."
mechanism: "Foundries fund fabs, tools, recipes, process experiments and much of scrap; customers fund design, IP, masks, NRE, engineering wafers and volume commitments while bearing respin and launch delay; equipment and material suppliers co-debug qualified interfaces; contracts determine wafer versus die pricing, priority, guarantees, remedies and data access, while linked production data determines learning speed."
example: "Intel's disclosures separate delayed 10nm volume production, 2019 full production and 2020 yield below mature 14nm, showing that shipment, scale and mature unit economics are different commercial states."
my_take: "I should trace who pays each early-ramp cost, who owns the design and manufacturing evidence, which improvements can be reused across customers, how contracts divide low-yield and delay risk, and whether higher output reflects yield, wafer starts, die size, product mix or test and packaging changes."

