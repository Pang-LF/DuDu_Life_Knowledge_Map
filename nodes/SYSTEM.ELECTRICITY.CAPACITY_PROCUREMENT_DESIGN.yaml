id: "SYSTEM.ELECTRICITY.CAPACITY_PROCUREMENT_DESIGN"
name_en: "Capacity Procurement Design"
name_zh: "容量采购设计"
domain: "SYSTEM"
module: "Energy Systems（能源系统）"
importance: "Core"
mastery_current: "L0"
mastery_candidate: "L1"

what: "Capacity procurement design converts a probabilistic reliability target into accredited MW commitments, prices, contract terms, performance duties, and cost allocation across centralized auctions, bilateral obligations, long-term contracts, scarcity pricing, or hybrids."
why: "The same physical reliability target can produce different investment timing, financing cost, performance incentives, customer volatility, transparency, market-power exposure, and stranded-cost risk depending on how quantity, price, duration, and obligation are specified."
mechanism: "Set the reliability requirement; forecast load; accredit resource contribution; define a demand curve or LSE obligation; accept audited net-cost and opportunity-cost offers or bilateral contracts; clear quantity and price; verify deliverability and performance; apply penalties; allocate cost to load; and update the design when physical lead times or risk distributions change."
example: "For PJM 2027/28, 134,478.1 MW UCAP cleared in RPM and 11,299 MW was committed through FRR, but total procurement remained 6,517 MW below the reliability requirement because supply, load, accreditation, price-collar, permitting, equipment, and construction conditions did not align."
my_take: "I should evaluate a procurement mechanism by the reliable product delivered, timing, duration, performance verification, alternatives, and allocation of forecast and delivery risk rather than by whether it is labeled a market or a contract."

