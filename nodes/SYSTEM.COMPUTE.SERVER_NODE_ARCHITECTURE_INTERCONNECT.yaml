id: "SYSTEM.COMPUTE.SERVER_NODE_ARCHITECTURE_INTERCONNECT"
name_en: "Server Node Architecture and Interconnect"
name_zh: "服务器节点架构与互连"
domain: "SYSTEM"
module: "Compute Systems（计算系统）"
importance: "Core"
mastery_current: "L0"
mastery_candidate: "L1"

what: "A server node is a schedulable compute unit whose CPUs, system memory, accelerators, local accelerator memory, NICs, storage, power, cooling, firmware and software are organized by unequal interconnect paths and data-locality boundaries."
why: "Local chip roofs do not add into one universal server roof: a workload can use a resource only after its data reaches that resource through the actual topology, protocol, permissions and sustainable power-and-cooling envelope."
mechanism: "Place every important dataset in a named memory or storage location; trace CPU-memory, host-device, peer-to-peer, NIC and storage paths; measure bandwidth, latency and contention for the actual route; verify P2P, NUMA placement, driver and runtime enablement; then include synchronization, power caps and thermal throttling in end-to-end performance."
example: "Each Summit node paired two POWER9 CPUs, six V100 GPUs, 512 GB DDR4, 96 GB HBM2, 1.6 TB NVMe, NVLink and dual-rail EDR InfiniBand; deployment tests found that a cgroups configuration could block direct GPU-to-GPU communication despite the physical NVLink hardware."
my_take: "I should treat a server as a map of data locations and paths, not a sum of component peaks, and require topology plus software, telemetry and end-to-end evidence before calling any link or accelerator usable capacity."

