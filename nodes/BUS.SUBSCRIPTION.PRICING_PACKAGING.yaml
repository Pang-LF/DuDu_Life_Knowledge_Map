id: "BUS.SUBSCRIPTION.PRICING_PACKAGING"
name_en: "Pricing and Packaging"
name_zh: "定价与套餐设计"
domain: "BUSINESS"
module: "Subscription Economics（订阅经济）"
importance: "Core"
mastery_current: "L0"
mastery_candidate: "L1"

what: "Pricing sets the exchange terms for access; packaging groups content, features, advertising experience and products into plans. Tiers and price fences let customers self-select among different prices and experiences."
why: "A uniform price can leave willingness to pay unserved or trigger avoidable churn. Tiering may preserve a lower entry point while monetizing advertising or higher willingness to pay, but it also adds complexity and cannibalization risk."
mechanism: "Define plan entitlements and fences; track starts, migrations, upgrades, downgrades and cancellations by cohort; combine realized subscription revenue, advertising revenue, attributable costs and retention; compare plan-level contribution, payback and LTV rather than list price or aggregate ARPU alone."
example: "In December 2022 Disney+ kept an ad-supported U.S. entry tier at $7.99 per month while moving the ad-free tier from $7.99 to $10.99, a 37.5% increase. By September 2023 the U.S. ad tier had 5.2 million subscribers, while fiscal-2023 domestic ARPU rose from $6.34 to $6.97 due to retail pricing and advertising, partly offset by multi-product plan mix."
my_take: "I should judge a pricing change by plan-level retained contribution and migration, not by the percentage increase in list price."

