id: "SYSTEM.ELECTRICITY.RELIABILITY_METRICS_LOLE_EUE"
name_en: "Reliability Metrics: LOLE and EUE"
name_zh: "可靠性指标：失负荷期望与预期未供电量"
domain: "SYSTEM"
module: "Energy Systems（能源系统）"
importance: "Core"
mastery_current: "L0"
mastery_candidate: "L1"

what: "LOLE is the probability-weighted expected duration of modeled periods in which available supply is insufficient for demand, while EUE is the probability-weighted expected MWh of the resulting shortfall. LOLE measures boundary crossings in time; EUE measures the energy below the boundary."
why: "Two portfolios can have the same expected shortage duration but radically different shortage depth, or the same expected unserved energy with radically different duration and event shape. Neither metric alone describes customer outage experience, location, sequence, or distribution."
mechanism: "For each simulated hour and system state, calculate shortfall as max(load minus available supply, zero). Sum the probability of positive shortfall across hours for LOLE, and sum probability times shortfall MW times interval duration for EUE. Preserve the weather, outage, demand, network, location, and intervention assumptions that generated the distribution."
example: "Great Britain's 2014 reliability standard adopted 3 hours LOLE per capacity year after the central 2013 economic assumptions produced 2.78 hours. The standard governs capacity procurement but does not promise three customer-outage hours or reveal the size of any modeled shortfall."
my_take: "I should ask whether a reliability claim measures expected duration, expected MWh, event frequency, customers interrupted, location, or tail severity, then inspect the probability model and operational boundary before comparing systems."

