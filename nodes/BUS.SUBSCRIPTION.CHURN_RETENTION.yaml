id: "BUS.SUBSCRIPTION.CHURN_RETENTION"
name_en: "Churn and Retention by Cohort"
name_zh: "按队列理解流失与留存"
domain: "BUSINESS"
module: "Subscription Economics（订阅经济）"
importance: "Core"
mastery_current: "L0"
mastery_candidate: "L1"

what: "Churn is a defined rate of relationship exits over a stated denominator and time window. Retention follows the same acquisition cohort across relationship age, while a period's aggregate churn mixes cohorts, plans, channels, prices, and exit mechanisms."
why: "An improving aggregate churn metric can reflect better customer experience, fewer high-risk new customers, prior exit of price-sensitive customers, or a changing mix. Without cohorts, a team cannot tell which relationship or operational lever changed."
mechanism: "Specify logo or revenue unit, cancellation event, denominator, and period; group customers by acquisition time and relevant offer; compute retention by months since start and monthly exit hazard among those active at each month; separate voluntary, involuntary, migration, pause, and reactivation paths."
example: "Netflix defined Q3 2011 monthly churn as 5.519 million cancellations divided by 24.594 million beginning subscribers plus 4.714 million gross additions, then divided by three, yielding 6.3%. This aggregate rose from 4.2% in Q2 and 3.8% a year earlier but did not reveal which tenure or plan cohort drove the change."
my_take: "I should not ask only whether churn moved; I should ask which cohort, at what relationship age, under which price and plan, left through which mechanism."

