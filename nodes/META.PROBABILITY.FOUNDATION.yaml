id: "META.PROBABILITY.FOUNDATION"
name_en: "Probability Foundation"
name_zh: "概率基础"
domain: "META"
module: "Probability & Bayesian Thinking（概率与贝叶斯思维）"
importance: "Core"
mastery_current: "L0"
mastery_candidate: "L2"

what: "Probability is a number from zero to one assigned to a defined event under a stated time horizon, information set, and model. It quantifies uncertainty before resolution rather than relabeling the outcome afterward."
why: "Without an explicit event, horizon, information date, and model, percentages cannot be compared, checked, calibrated, or updated. A single realized outcome also cannot by itself validate or falsify a non-extreme probability."
mechanism: "Define the unit and event; specify time and scope; state the available information and generating model; assign probability mass across mutually exclusive outcomes; update the allowed outcome distribution when evidence changes; assess quality across comparable forecasts and model checks rather than one realization."
example: "Apophis briefly had an estimated 2.7% probability of impacting Earth on April 13, 2029 under limited 2004 observations. Archival optical images and radar narrowed and shifted the allowed orbit distribution, ruling out 2029 and, by 2021, any impact for at least 100 years even though the asteroid's true trajectory had not changed."
my_take: "Before debating a probability, I should ask what exact event, deadline, information set, model, and comparison class the number describes."

