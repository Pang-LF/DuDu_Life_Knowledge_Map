id: "SYSTEM.ELECTRICITY.DAY_AHEAD_REAL_TIME_SETTLEMENT"
name_en: "Day-Ahead, Real-Time and Two-Settlement"
name_zh: "日前、实时与双结算"
domain: "SYSTEM"
module: "Energy Systems（能源系统）"
importance: "Core"
mastery_current: "L0"
mastery_candidate: "L1"

what: "A two-settlement electricity market prices a scheduled day-ahead quantity at the day-ahead price and settles only the difference between actual and scheduled quantity at the real-time price."
why: "The power system must prepare before demand, weather, outages, and network conditions are fully known, yet actual injections and withdrawals must still balance in real time."
mechanism: "For each settlement point and interval, total settlement equals Q_DA times P_DA plus the deviation Q_RT minus Q_DA times P_RT; the day-ahead position hedges a defined quantity while real-time prices assign the marginal cost of forecast and performance deviations."
example: "A load-serving entity buying 100 MWh day-ahead at $40/MWh but consuming 110 MWh when real-time price is $500/MWh pays $4,000 day-ahead plus $5,000 for the 10 MWh deviation, not 110 MWh twice."
my_take: "Before calling a position hedged, I should specify quantity, interval, settlement point, counterparty, physical performance, and collateral, then calculate only the deviation at the real-time price."

