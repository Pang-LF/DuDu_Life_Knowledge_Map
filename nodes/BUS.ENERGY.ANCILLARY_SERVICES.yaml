id: "BUS.ENERGY.ANCILLARY_SERVICES"
name_en: "Ancillary Services"
name_zh: "辅助服务"
domain: "BUSINESS"
module: "Industry Atlas（产业图谱）"
importance: "Core"
mastery_current: "L0"
mastery_candidate: "L1"

what: "Ancillary services are technically specified reliability capabilities procured by a system operator, including frequency response, restoration, reserve, voltage support, and black start, that are not fully described by ordinary MWh delivery."
why: "Energy schedules do not guarantee speed, direction, headroom, duration, location, telemetry, or recovery; separate products and obligations make these system-control capabilities visible, testable, and compensable."
mechanism: "Qualified generators, storage, demand response, industrial loads, and interconnectors reserve capability under performance requirements and may receive availability, activation, or performance payments while bearing opportunity costs and non-performance penalties."
example: "During the 8 January 2021 Continental Europe split, roughly 1.7 GW of French and Italian industrial load was disconnected under prior contracts, turning foregone consumption into fast upward balancing support for the north-west area."
my_take: "I should define the reliability outcome, technical specification, payment basis, opportunity cost, performance test, and failure correlation before comparing an ancillary-service offer with ordinary energy."

