id: "SYSTEM.COMPUTE.NOVEMBER_INTEGRATION_AI_INFRASTRUCTURE_BRIDGE"
name_en: "November Integration and AI Infrastructure Bridge"
name_zh: "十一月整合与人工智能基础设施桥接"
domain: "SYSTEM"
module: "Compute Systems（计算系统）"
importance: "Core"
mastery_current: "L0"
mastery_candidate: "L1"

what: "AI infrastructure capacity is the rate of validated and preserved model progress produced by a matched stack, not the number of installed GPUs; the binding constraint is the first layer where one more unit of effective capacity would increase that useful progress under the current workload and operating state."
why: "A large synchronous AI job can have thousands of powered accelerators yet lose progress to model fit, memory, collectives, stragglers, network topology, thermal limits, failures, checkpointing or upstream qualification, so component counts do not identify usable capacity."
mechanism: "Start from one validated training step, trace its data, model state, runtime, compute, HBM, interconnect, server, network, power, cooling, checkpoint and repair dependencies, separate provisioned, runnable, active, useful and preserved capacity, then test which marginal relief raises preserved progress; repeat when workload phase or system state changes."
example: "Meta trained Llama 3.1 405B on 15.6 trillion tokens with up to 16,384 H100 GPUs and four-dimensional parallelism; a 54-day reliability snapshot recorded 419 unexpected interruptions, while measured MFU ranged from 38% to 43% and effective training time exceeded 90%, showing that useful progress depended on the complete operating stack."
my_take: "I should begin with the model progress that survives correctness and checkpoint boundaries, then move backward through the stack and test marginal relief instead of declaring the most expensive or most visible component the bottleneck."

