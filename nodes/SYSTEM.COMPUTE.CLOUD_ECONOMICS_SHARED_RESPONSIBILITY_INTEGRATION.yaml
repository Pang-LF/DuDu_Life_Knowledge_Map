id: "SYSTEM.COMPUTE.CLOUD_ECONOMICS_SHARED_RESPONSIBILITY_INTEGRATION"
name_en: "Cloud Economics and Shared Responsibility Integration"
name_zh: "云经济学与共同责任整合"
domain: "SYSTEM"
module: "Compute Systems（计算系统）"
importance: "Core"
mastery_current: "L0"
mastery_candidate: "L1"

what: "Cloud economics compares one complete business service under the same useful-output, demand, performance, reliability, time and exit boundaries, then identifies how a productized cloud service reallocates asset ownership, capacity utilization, delivery speed, operating work and residual risk between provider and customer."
why: "An instance-hour price and a server purchase price describe different objects: cloud pricing includes pooled capacity and selected operating responsibilities, while both cloud and owned infrastructure retain application, data, reliability, migration and business-interruption costs that can appear in different accounts."
mechanism: "Follow one useful request or stored object through compute, storage, network, identity, reliability, operations and recovery; fix demand shape and service quality; annualize owned capital and divide by useful utilization; add cloud usage, commitment, requests and transfer; then include people, migration, optionality, failure headroom, exit and business-loss exposure before assigning each responsibility to the party that controls it."
example: "Dropbox reported that its 2016 Infrastructure Optimization reduced third-party datacenter expense by $92.5 million while increasing depreciation, facilities and support expense for internal infrastructure by $53.0 million, producing a $39.5 million net infrastructure-cost reduction rather than making storage cost disappear."
my_take: "I should reject rent-versus-buy slogans and compare the same business outcome across the full lifecycle, asking which cost or risk truly disappears, which moves to another party and which only changes accounting form."

