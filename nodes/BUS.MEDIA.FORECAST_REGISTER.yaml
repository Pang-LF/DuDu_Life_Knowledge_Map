id: "BUS.MEDIA.FORECAST_REGISTER"
name_en: "Streaming Forecast Register"
name_zh: "流媒体预测登记簿"
domain: "BUSINESS"
module: "Subscription Video / Pay-TV / Streaming（订阅视频 / 付费电视 / 流媒体）"
importance: "Core"
mastery_current: "L0"
mastery_candidate: "L1"

what: "A streaming forecast register converts the connected industry model and scenario signals into dated, probabilistic, resolvable claims with preserved update histories."
why: "Industry narratives about bundles, DTC, sports and platform power can all sound plausible after the fact. A register makes the event, horizon, source and probability explicit so later evidence can update and eventually score the judgment."
mechanism: "Start from the value chain and scenario uncertainties; extract observable events about aggregation, direct access, rights execution and cohort disclosure; state exact deadlines and resolution sources; assign baseline probabilities; preserve updates; settle each event separately; evaluate calibration only after enough resolved records accumulate."
example: "The September 2026 register begins with four forecasts covering multi-provider re-aggregation, continued standalone DTC offers, execution of the NBA's three-group rights structure and disclosure of direct-versus-partner cohort economics."
my_take: "I should turn claims about streaming's future into separately resolvable records and avoid treating one bundle launch or one subscriber total as proof of an entire scenario."

