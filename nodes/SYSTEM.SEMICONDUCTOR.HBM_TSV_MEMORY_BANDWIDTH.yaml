id: "SYSTEM.SEMICONDUCTOR.HBM_TSV_MEMORY_BANDWIDTH"
name_en: "HBM, TSV and Memory Bandwidth"
name_zh: "高带宽存储、硅通孔与存储带宽"
domain: "SYSTEM"
module: "Compute Systems（计算系统）"
importance: "Core"
mastery_current: "L0"
mastery_candidate: "L1"

what: "High Bandwidth Memory places vertically stacked DRAM beside an accelerator and connects it through TSVs, die bonds and thousands of short package-level I/O paths, trading package complexity for high aggregate bandwidth, compact footprint and improved data-movement efficiency."
why: "Parallel accelerators can leave arithmetic units idle when external memory cannot supply data fast enough, so useful compute depends on capacity, bandwidth, latency, access pattern and effective utilization rather than peak operations alone."
mechanism: "DRAM arrays serve requested data through banks and channels; signals move vertically through TSVs across thinned die; the stack exposes a very wide interface through a base or interface die; an interposer or dense package route connects multiple stacks to accelerator memory controllers; peak bandwidth equals I/O width times per-pin transfer rate divided by eight, while effective bandwidth depends on software locality, concurrency, bank behavior, cache reuse and controller scheduling."
example: "AMD and SK hynix commercialized first-generation HBM in the 2015 Radeon R9 Fury X, combining 4 GB HBM with a 4096-bit interface and up to 512 GB/s, while later H100 and H200 accelerators show the subsequent growth of HBM capacity and bandwidth."
my_take: "I should distinguish capacity, peak bandwidth, effective bandwidth and latency; follow one data block through cells, TSVs, stack, interposer and controller; then include stack yield, thermal margin, package yield and matched supply before concluding that more HBM creates more useful compute."

