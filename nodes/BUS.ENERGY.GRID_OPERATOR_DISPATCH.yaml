id: "BUS.ENERGY.GRID_OPERATOR_DISPATCH"
name_en: "Grid Operator Dispatch"
name_zh: "电网运营者调度"
domain: "BUSINESS"
module: "Industry Atlas（产业图谱）"
importance: "Core"
mastery_current: "L0"
mastery_candidate: "L1"

what: "Grid operator dispatch selects and directs generation, storage, demand response, imports, and reserves so that active power remains balanced while network, operating, and reliability constraints are satisfied."
why: "The cheapest resource may start too slowly, sit behind congestion, lack duration, share a failure mode, or consume the upward headroom needed for a contingency; marginal energy cost is only one input after physical feasibility."
mechanism: "The operator combines forecasts and telemetry with offers, availability, startup time, ramp rate, minimum output, duration, state of charge, transmission limits, contingency criteria, frequency response, and reserve requirements, then redispatches as system conditions change."
example: "Before the 9 August 2019 Great Britain disruption, the ESO held about 1,000 MW of response; the combined rare losses reached about 2,100 MW, exposing why dispatch must procure speed, headroom, duration, visibility, and correlated-risk protection rather than only cheap MWh."
my_take: "When choosing the next resource, I should define the needed MW, start time, duration, location, failure correlation, total cost, and the plan to rebuild reserve after activation."

