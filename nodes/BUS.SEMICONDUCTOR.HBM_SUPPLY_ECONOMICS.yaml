id: "BUS.SEMICONDUCTOR.HBM_SUPPLY_ECONOMICS"
name_en: "HBM Supply Economics"
name_zh: "高带宽存储供应经济学"
domain: "BUSINESS"
module: "Industry Atlas（产业图谱）"
importance: "Core"
mastery_current: "L0"
mastery_candidate: "L1"

what: "HBM supply economics concerns the matched delivery of customer-qualified memory stacks, logic die, interposers, substrates, advanced-package capacity, thermal design and final test rather than raw DRAM wafer volume alone."
why: "An accelerator needs a fixed configuration of qualified HBM stacks and package interfaces, so one scarce component, qualification path or integration slot can cap good-package output and give its controller bargaining power."
mechanism: "Memory IDMs design and manufacture HBM die, TSVs, stacks and test flows; accelerator firms specify interfaces, stack counts, capacity and thermals; foundries and packaging providers integrate logic and memory; equipment and material vendors enable thinning, bonding, metrology and test; contracts and qualification determine accepted output, pricing, allocation, scrap and switching time; final output is bounded by the minimum matched input times final package yield."
example: "A transparent teaching model with 1,000 good logic die, 5,500 qualified stacks at six per package and 900 package slots produces at most 900 packages before a hypothetical 95% final yield, or about 855 good accelerators; adding memory alone does not raise output while package slots remain fixed."
my_take: "I should translate every capacity announcement into qualified stacks of a named generation and customer, divide by stacks per package, compare logic and package capacity, include cycle time and final yield, and avoid inventing confidential price, allocation, yield or liability terms."

