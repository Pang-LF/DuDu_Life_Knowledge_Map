id: "BUS.SEMICONDUCTOR.ACCELERATOR_PERFORMANCE_ECONOMICS"
name_en: "Accelerator Performance Economics"
name_zh: "加速器性能经济学"
domain: "BUSINESS"
module: "Industry Atlas（产业图谱）"
importance: "Core"
mastery_current: "L0"
mastery_candidate: "L1"

what: "Accelerator performance economics compares devices and cloud services by time, cost, energy and service quality per useful output under an equivalent workload rather than by peak operations or hourly price alone."
why: "A high hourly price can yield a lower completed-job cost when a workload reaches the device's raised ceiling, while a peak-compute premium can be wasted when memory, communication, shape, software or latency remains limiting."
mechanism: "Fix model, precision, batch, input shape, software, correctness and SLA; measure end-to-end time and resource utilization; multiply billed time by rate; add porting, validation, idle-capacity, power, network and operational costs; then compare cost per successful output and the risk of missing service objectives."
example: "Google's TPU v1 paper used performance per watt as a TCO proxy because negotiated processor prices were not publishable, while its production workloads showed that the same 92-TOPS device delivered from 2.8 to 86 TOPS depending on intensity, shape and response-time conditions."
my_take: "I should treat TOPS, bandwidth and hourly rate as inputs, then compare equivalent workload time-to-solution, tail latency, useful utilization, cost per output, engineering burden and capacity risk before drawing a purchase conclusion."

