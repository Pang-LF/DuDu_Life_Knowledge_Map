id: "META.CAUSAL.CORRELATION_CAUSATION"
name_en: "Correlation, Causation, and Reverse Causality"
name_zh: "相关、因果与反向因果"
domain: "META"
module: "Causal Reasoning（因果推理）"
importance: "Core"
mastery_current: "L0"
mastery_candidate: "L2"

what: "Correlation is a symmetric observation that variables co-vary. Causation is the directional claim that changing one variable would change another. Reverse causality occurs when the presumed outcome changes the presumed cause."
why: "Predictions, interventions, and explanations require different evidence. Treating every predictor as a lever can make a business, medical, or personal decision target the wrong variable."
mechanism: "Begin with the observed association, state the proposed intervention direction, establish whether exposure precedes outcome, test whether the outcome could have changed exposure, and seek patterns produced by changing the exposure rather than merely measuring both variables once."
example: "The smoking-lung cancer evidence moved from a strong 1950 case-control association to prospective exposure measurement, dose and duration gradients, cessation patterns, repeated studies, and biological mechanisms that increasingly constrained reverse-direction explanations."
my_take: "Before treating an associated variable as a lever, I should say what changing it means, place cause before effect, and ask whether the outcome has already altered the variable I measured."

