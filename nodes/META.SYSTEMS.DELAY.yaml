id: "META.SYSTEMS.DELAY"
name_en: "Delay"
name_zh: "延迟"
domain: "META"
module: "Systems Thinking（系统思维）"
importance: "Core"
mastery_current: "L0"
mastery_candidate: "L2"

what: "Delay is the time interval separating a cause or intervention from its arrival in another part of the system or its appearance in an observable outcome."
why: "Current results often reflect past inputs. Without matching observation and decision intervals to the causal timescale, people can mistake a pending effect for failure, repeat an action before feedback returns, or abandon an effective intervention."
mechanism: "Material transport, information processing, implementation, and slow adjustment of accumulated stocks separate action from outcome. Leading variables may turn first, intermediate states later, and final outcomes last; repeated decisions made inside that gap can create overshoot or oscillation."
example: "Ozone-depleting emissions fell sharply after the Montreal Protocol, but long-lived atmospheric CFC stocks and years of stratospheric transport meant effective chlorine peaked nearly a decade after emissions and ozone recovery will take decades."
my_take: "Before judging an intervention, I should state which variable should change first, which stock must adjust, how long each step should take, and what evidence would distinguish delay from ineffectiveness."

