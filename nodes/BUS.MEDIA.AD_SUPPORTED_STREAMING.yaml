id: "BUS.MEDIA.AD_SUPPORTED_STREAMING"
name_en: "Ad-Supported Streaming"
name_zh: "广告支持流媒体"
domain: "BUSINESS"
module: "Subscription Video / Pay-TV / Streaming（订阅视频 / 付费电视 / 流媒体）"
importance: "Core"
mastery_current: "L0"
mastery_candidate: "L1"

what: "Ad-supported streaming turns viewing time into measurable advertising inventory while charging viewers a lower subscription fee or no fee. The platform serves both viewers and advertisers through the same content and product."
why: "A second payer can expand monetization and support a lower consumer price, but value depends on viewing, ad load, sold inventory, realized net CPM, ad costs, rights, experience and retention rather than subscriber price alone."
mechanism: "Acquire and retain an active ad-tier audience; create limited ad inventory from viewing; sell and deliver impressions subject to fill and frequency controls; measure advertiser outcomes; combine subscription and advertising revenue; subtract attributable content, service, sales and technology costs; compare cohort retention and LTV with ad-free alternatives."
example: "Netflix launched U.S. Basic with Ads at $6.99 in November 2022 with an average four to five advertising minutes per hour. It reported nearly 5 million global monthly active users in May 2023, 15 million in November 2023 and 40 million in May 2024, while public data did not disclose plan-level contribution or LTV."
my_take: "I should evaluate an ad tier as a two-sided cohort business whose unit value is conditional on viewing, fill, net CPM, costs and retention, not as a cheap subscription with automatic extra revenue."

