id: "BUS.SEMICONDUCTOR.CLOUD_SERVICE_RELIABILITY_ECONOMICS"
name_en: "Cloud Service Reliability Economics"
name_zh: "云服务可靠性经济学"
domain: "BUSINESS"
module: "Industry Atlas（产业图谱）"
importance: "Core"
mastery_current: "L0"
mastery_candidate: "L1"

what: "Cloud service reliability economics allocates the cost and residual risk of redundant infrastructure, standby workload capacity, replication, cross-zone or cross-region traffic, managed operations, failover testing and service interruption among provider, customer, managed-service operator and end user."
why: "A provider can supply Regions and Availability Zones while a customer still deploys a single-zone application; an SLA can grant future service credits without compensating complete business loss; and high utilization can consume the spare capacity required for static recovery."
mechanism: "Name the service function and failure set, trace who owns and pays for each active and standby layer, separate provider infrastructure and service obligations from customer workload architecture and data duties, compare incremental protection cost with business-impact reduction, and read SLA measurement, exclusions and remedies rather than treating the headline availability percentage as insurance."
example: "AWS currently distinguishes a 99.5% single-EC2-instance SLA from a 99.99% Region-level SLA for running instances deployed concurrently across two or more Availability Zones, with eligible remedies expressed as future service credits rather than broad business-loss reimbursement."
my_take: "I should identify what exact failure-state capability the customer is buying, whether standby capacity and data are already usable, and which downtime, data, revenue and liability losses remain outside the provider SLA."

